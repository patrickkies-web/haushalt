    const iso   = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-01`;
    $("f-deact-date").value = iso;
    $("deact-hint").textContent = `(ab ${today.toLocaleDateString("de-DE", { month: "long", year: "numeric" })})`;
    $("deact-btn").textContent = "Reaktivieren";
  }
}

function clearDeact() {
  $("f-deact-date").value = "";
  $("deact-hint").textContent = "";
  $("deact-btn").textContent = "Deaktivieren";
}

function getInc(mk, field) {
  const m = income[String(mk)];
  return (m && m[field]) ? Number(m[field]) : 0;
}

function setInc(mk, field, val) {
  const k = String(mk);
  if (!income[k]) income[k] = {};
  income[k][field] = val;
}

function updateIncomeCol(mk) {
  const p    = getInc(mk, 'patrick');
  const s    = getInc(mk, 'sara');
  const o    = getInc(mk, 'other');
  const tot  = p + s + o;
  const surp = tot - (lastTotals[mk - lastStartIdx] || 0);
  const half = surp / 2;
  const prevS  = getInc(mk, 'prevSara');
  const prevP  = getInc(mk, 'prevPatrick');
  const sock   = getInc(mk, 'sockel');
  const remain = surp - sock * 2 - prevS - prevP;
  const hasData = p || s || o || sock || prevS || prevP;

  const set = (id, v) => {
    const el = document.getElementById(id);
    if (el) el.textContent = hasData ? eur.format(v) : '–';
  };

  set(`cc-total-${mk}`,    tot);
  set(`cc-surp-${mk}`,     surp);
  set(`cc-half-${mk}`,     half);
  set(`cc-remain-${mk}`,   remain);
  set(`cc-sarap-${mk}`,    sock + prevS);
  set(`cc-patrickp-${mk}`, sock + prevP);
}

function catColor(cat) {
  const i = CATS.indexOf(cat);
  return PALETTE[(i < 0 ? CATS.length - 1 : i) % PALETTE.length];
}

function initials(name) {
  return (name.trim()[0] || "?").toUpperCase();
}

function nextOccurrence(s) {
  if (!s.date) return null;
  let d = new Date(s.date + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const step = { monthly: 1, quarterly: 3, yearly: 12 }[s.cycle];
  let guard = 0;
  while (d < today && guard < 400) {
    d.setMonth(d.getMonth() + step);
    guard++;
  }
  return d;
}

function daysUntil(d) {
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  return Math.round((d - t) / 86400000);
}

function relDays(n) {
  if (n === 0) return "heute";
  if (n === 1) return "morgen";
  return "in " + n + " Tagen";
}

function parseAmount(v) {
  const n = parseFloat(String(v).replace(/\s/g, "").replace(/\./g, "").replace(",", "."));
  return isNaN(n) ? NaN : n;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function animateAmount(el, target) {
  if (!el) return;
  if (window.matchMedia("(prefers-reduced-motion:reduce)").matches) {
    el.textContent = eur.format(target);
    return;
  }
  const dur = 600, t0 = performance.now();
  function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = eur.format(target * e);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const hasData = subs.length > 0;
  $("toolbar").style.display = hasData ? "flex" : "none";
  $("fab").style.display = "flex";

  const totalMonthly = subs.reduce((a, s) => a + monthlyOf(s), 0);
  const totalYearly  = totalMonthly * 12;

  let html = "";
  html += `<div class="sum-label">Summe pro Monat</div>`;
  html += `<div class="sum-figure"><span class="amt" id="bigamt">${eur.format(0)}</span></div>`;
  html += `<div class="sum-meta">
    <span>≈ <b class="num">${eur0.format(totalYearly)}</b> im Jahr</span>
    <span><b class="num">${subs.length}</b> ${subs.length === 1 ? "Abo" : "Abos"}</span>
  </div>`;

  if (hasData) {
    // Composition bar
    const byCat = {};
    subs.forEach(s => { byCat[s.cat] = (byCat[s.cat] || 0) + monthlyOf(s); });
    const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

    html += `<div class="bar" id="bar">`;
    entries.forEach(([cat, v]) => {
      html += `<span data-w="${(v / totalMonthly * 100).toFixed(2)}" style="width:0;background:${catColor(cat)}"></span>`;
    });
    html += `</div><div class="legend">`;
    entries.forEach(([cat, v]) => {
      html += `<div><i style="background:${catColor(cat)}"></i>${cat} <b class="num">${eur0.format(v)}</b></div>`;
    });
    html += `</div>`;

    // Next payment
    const upcoming = subs
      .map(s => ({ s, d: nextOccurrence(s) }))
      .filter(x => x.d)
      .sort((a, b) => a.d - b.d)[0];

    if (upcoming) {
      const n = daysUntil(upcoming.d);
      html += `<div class="next">
        <span class="pill">Nächste Zahlung</span>
        <span><b>${esc(upcoming.s.name)}</b> · ${relDays(n)} · <span class="num">${eur.format(upcoming.s.amount)}</span></span>
      </div>`;
    }
  } else {
    html += `<div class="next" style="margin-top:16px;border:none;padding-top:14px">
      <span>Noch nichts erfasst — füge unten dein erstes Abo hinzu.</span>
    </div>`;
  }

  $("summary").innerHTML = html;
  animateAmount($("bigamt"), totalMonthly);
  requestAnimationFrame(() => {
    const bar = $("bar");
    if (bar) bar.querySelectorAll("span").forEach(sp => sp.style.width = sp.dataset.w + "%");
  });

  renderForecast();
  renderTransactions();

  // Subscription list
  $("count").textContent = subs.length + (subs.length === 1 ? " Eintrag" : " Einträge");
  const sortBy = $("sort").value;
  const sorted = [...subs].sort((a, b) => {
    if (sortBy === "name") return a.name.localeCompare(b.name, "de");
    if (sortBy === "next") {
      const da = nextOccurrence(a), db = nextOccurrence(b);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da - db;
    }
    return monthlyOf(b) - monthlyOf(a);
  });

  if (!hasData) {
    $("list").innerHTML = `<div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="#0f6e54" stroke-width="1.5"/>
        <path d="M12 8v4l2.5 2.5" stroke="#0f6e54" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h2>Behalte den Überblick</h2>
      <p>Erfasse deine Abos und Fixkosten — Turnus rechnet alles auf einen Monats- und Jahreswert um.</p>
      <button class="btn btn-primary" onclick="openSheet()">Erstes Abo hinzufügen</button>
    </div>`;
    return;
  }

  const renderSubRow = (s, inactive = false) => {
    const norm = s.cycle === "monthly" ? "" : ` · ≈ ${eur.format(monthlyOf(s))}/Mon.`;
    let deactTag = "";
    if (inactive && s.deactivatedFrom) {
      const d = new Date(s.deactivatedFrom + "T00:00:00");
      deactTag = `<div class="sub-deact-tag">Inaktiv seit ${d.toLocaleDateString("de-DE", { month: "short", year: "numeric" })}</div>`;
    }
    return `<div class="row${inactive ? " inactive-sub" : ""}" onclick="openSheet('${s.id}')">
      <div class="swatch" style="background:${catColor(s.cat)}">${esc(initials(s.name))}</div>
      <div class="row-main">
        <div class="row-name">${esc(s.name)}</div>
        <div class="row-sub">${esc(s.cat)}${norm}</div>
        ${deactTag}
      </div>
      <div class="row-amt">
        <div class="v">${eur.format(s.amount)}</div>
        <div class="c">${CYCLES[s.cycle].label}</div>
      </div>
    </div>`;
  };

  const activeSubs   = sorted.filter(s => !subIsInactive(s));
  const inactiveSubs = sorted.filter(s => subIsInactive(s));

  let listHtml = activeSubs.map(s => renderSubRow(s)).join("");

  if (inactiveSubs.length > 0) {
    listHtml += `<button class="inactive-toggle" onclick="toggleInactive()">
      <span>Inaktive Abos (${inactiveSubs.length})</span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="transition:transform .2s;transform:rotate(${showInactive ? 180 : 0}deg)">
        <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>`;
    if (showInactive) {
      listHtml += inactiveSubs.map(s => renderSubRow(s, true)).join("");
    }
  }

  $("list").innerHTML = listHtml;
}

function renderForecast() {
  const host = $("forecast");
  if (subs.length === 0) { host.innerHTML = ""; return; }

  const PAST     = 6;             // months to show in the past
  const FUTURE   = 35;            // months to show in the future
  const N        = PAST + 1 + FUTURE;
  const now      = new Date();
  now.setDate(1);
  now.setHours(0, 0, 0, 0);
  const curMk    = now.getFullYear() * 12 + now.getMonth();
  const startIdx = curMk - PAST;  // absolute month index of column 0
  const stepOf   = { monthly: 1, quarterly: 3, yearly: 12 };
  const mf       = new Intl.DateTimeFormat("de-DE", { month: "short" });

  const colDate = k => new Date(now.getFullYear(), now.getMonth() - PAST + k, 1);
  const colYYMM = k => { const d = colDate(k); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
  const isPast  = k => k < PAST;
  const isCur   = k => k === PAST;

  // Month headers
  let head = `<th class="name">Ausgabe</th>`;
  for (let k = 0; k < N; k++) {
    const d     = colDate(k);
    const cls   = [isCur(k) ? "cur" : "", isPast(k) ? "past-col" : ""].filter(Boolean).join(" ");
    head += `<th class="${cls}">${mf.format(d).replace(".", "")}<span class="yr">'${String(d.getFullYear()).slice(2)}</span></th>`;
  }

  const baseIndex = s => {
    const d = s.date ? new Date(s.date + "T00:00:00") : new Date(now);
    return d.getFullYear() * 12 + d.getMonth();
  };

  const rows   = [...subs].sort((a, b) => monthlyOf(b) - monthlyOf(a));
  const totals = new Array(N).fill(0);
  let body     = "";

  rows.forEach(s => {
    const step    = stepOf[s.cycle];
    const bi      = baseIndex(s);
    const deactMk = subDeactMk(s);
    let cells     = "";
    for (let k = 0; k < N; k++) {
      const i     = startIdx + k;
      const phase = (((i - bi) % step) + step) % step === 0;
      const withinActive = i < deactMk;
      const due   = phase && (bi <= curMk || i >= bi) && withinActive;
      const yymm  = colYYMM(k);
      const past  = isPast(k);
      const cur   = isCur(k);
      const baseCls = [cur ? "cur" : "", past ? "past-col" : ""].filter(Boolean).join(" ");
      // Mark the deactivation boundary cell
      const isDeactBoundary = (i === deactMk);

      if (due) {
        totals[k] += s.amount;
        const pay = (past || cur) ? getPayment(s.id, yymm) : null;
        if (pay) {
          const diffAmt = Math.abs(Math.abs(pay.txAmount) - s.amount) > 0.01;
          const fcCls   = diffAmt ? "fc-paid fc-diff" : "fc-paid fc-ok";
          cells += `<td class="${baseCls} ${fcCls}" onclick="fcCellClick('${s.id}','${yymm}')" title="${diffAmt ? 'Abweichung: geplant '+eur.format(s.amount) : 'Bezahlt'}">${eur.format(Math.abs(pay.txAmount))}</td>`;
        } else if (past || cur) {
          cells += `<td class="${baseCls} fc-unconfirmed" onclick="fcCellClick('${s.id}','${yymm}')" title="Noch nicht verknüpft">${eur.format(s.amount)}</td>`;
        } else {
          cells += `<td class="${baseCls}">${eur.format(s.amount)}</td>`;
        }
      } else if (isDeactBoundary) {
        cells += `<td class="empty ${baseCls} fc-deact-boundary" title="Deaktiviert ab diesem Monat">⊘</td>`;
      } else {
        cells += `<td class="empty ${baseCls}">–</td>`;
      }
    }
    const inactive = subIsInactive(s);
    const nameTag  = inactive
      ? `<span class="fc-inactive-badge">⊘</span>`
      : "";
    body += `<tr class="${inactive ? "fc-inactive-row" : ""}">
      <td class="name"><div class="namecell"><i style="background:${catColor(s.cat)}"></i><span>${esc(s.name)}${nameTag}</span></div></td>
      ${cells}
    </tr>`;
  });

  // Totals row
  let tot = `<td class="name"><span class="lbl">Summe / Monat</span></td>`;
  totals.forEach((v, k) => {
    const cls = [isCur(k) ? "cur" : "", isPast(k) ? "past-col" : ""].filter(Boolean).join(" ");
    tot += `<td class="${cls}">${v ? eur.format(v) : "–"}</td>`;
  });

  // Rotierkonto: only irregular (quarterly + yearly) subs need smoothing
  const irrTotals = new Array(N).fill(0);
  rows.forEach(s => {
    if (s.cycle === 'monthly') return;
    const step    = stepOf[s.cycle];
    const bi      = baseIndex(s);
    const deactMk = subDeactMk(s);
    for (let k = 0; k < N; k++) {
      const i = startIdx + k;
      const phase = (((i - bi) % step) + step) % step === 0;
      if (phase && (bi <= curMk || i >= bi) && i < deactMk) irrTotals[k] += s.amount;
    }
  });

  // Rhythm start: first month a transfer happens. Default = next month, so the
  // cushion gets funded at the end of the current one.
  const rotStartMk = (() => {
    const m = /^(\d{4})-(\d{2})$/.exec(rotCfg.start || "");
    return m ? (+m[1]) * 12 + (+m[2]) - 1 : curMk + 1;
  })();
  const rotStartCol = rotStartMk - startIdx;
  const setupPhase  = rotStartCol > PAST;   // rhythm has not begun yet

  // Window is always forward-looking: 24 months from the rhythm start, but
  // never reaching back before the current month once the rhythm is running.
  const WIN     = 24;
  const winFrom = Math.min(Math.max(rotStartCol, PAST), N - 1);
  const winEnd  = Math.min(winFrom + WIN, N);
  const winLen  = Math.max(1, winEnd - winFrom);
  const sumWin  = arr => arr.slice(winFrom, winEnd).reduce((a, v) => a + v, 0);
  const avgAll  = sumWin(totals)    / winLen;  // all subs — what a month really costs
  const avgIrr  = sumWin(irrTotals) / winLen;  // irregular only — the Rotierkonto rate

  // The deepest trough over the window decides the cushion
  let b = 0, minB = 0;
  for (let k = winFrom; k < winEnd; k++) {
    b += avgIrr - irrTotals[k];
    if (b < minB) minB = b;
  }
  const cushion = minB < -0.005 ? -minB : 0;

  // Ideal balance track, seeded with the cushion at the start of the rhythm
  const targetAt = new Array(N).fill(null);
  let t = cushion;
  for (let k = winFrom; k < N; k++) { t += avgIrr - irrTotals[k]; targetAt[k] = t; }

  // One transfer per month: bring the account from where it is to where it
  // should be. Without a known balance that is just the plain netto.
  const ist        = typeof rotCfg.balance === 'number' ? rotCfg.balance : null;
  const targetNow  = setupPhase ? cushion : (targetAt[PAST] ?? cushion);
  const plainNet   = setupPhase ? cushion : avgIrr - irrTotals[PAST];
  const action     = ist === null ? plainNet : targetNow - ist;

  const hasIrr = avgIrr > 0.005;

  // Average row, right under Summe / Monat
  let avgRow = `<td class="name"><span class="lbl">Ø / Monat · ${winLen} Mon.</span></td>`;
  for (let k = 0; k < N; k++) {
    const cls = [isCur(k) ? "cur" : "", isPast(k) ? "past-col" : ""].filter(Boolean).join(" ");
    avgRow += `<td class="${cls}">${avgAll > 0.005 ? eur.format(avgAll) : '–'}</td>`;
  }

  let rotSep = `<td class="name"><span class="lbl">Rotierkonto</span></td>`;
  let rotEin = `<td class="name"><span class="lbl">↑ Einzahlen / Monat</span></td>`;
  let rotAus = `<td class="name"><span class="lbl">↓ Auszahlen wenn fällig</span></td>`;
  let rotNet = `<td class="name"><span class="lbl">= Netto · Überweisung</span></td>`;
  let rotRes = `<td class="name"><span class="lbl">Rotierkonto Saldo</span></td>`;
  for (let k = 0; k < N; k++) {
    const cls = [isCur(k) ? "cur" : "", isPast(k) ? "past-col" : ""].filter(Boolean).join(" ");
    const due = irrTotals[k];
    rotSep += `<td class="${cls}"></td>`;
    if (!hasIrr || k < winFrom) {
      rotEin += `<td class="${cls}">–</td>`;
      rotAus += `<td class="${cls}">–</td>`;
      rotNet += `<td class="${cls}">–</td>`;
      rotRes += `<td class="${cls}">–</td>`;
      continue;
    }
    const net = avgIrr - due;
    rotEin += `<td class="${cls}">${eur.format(avgIrr)}</td>`;
    rotAus += `<td class="${cls}">${due > 0.005 ? eur.format(due) : '–'}</td>`;
    rotNet += `<td class="${cls} ${net < -0.005 ? 'rot-net-neg' : 'rot-net-pos'}">${net >= 0 ? '+' : '−'}${eur.format(Math.abs(net) < 0.005 ? 0 : Math.abs(net))}</td>`;
    const bal = targetAt[k];
    rotRes += `<td class="${cls}">${eur.format(Math.abs(bal) < 0.005 ? 0 : bal)}</td>`;
  }

  const mfLong   = new Intl.DateTimeFormat("de-DE", { month: "long", year: "numeric" });
  const startLbl = mfLong.format(new Date(Math.floor(rotStartMk / 12), rotStartMk % 12, 1));
  const fundBy   = mfLong.format(new Date(Math.floor((rotStartMk - 1) / 12), (rotStartMk - 1) % 12, 1));

  const note = !hasIrr
    ? ''
    : setupPhase
      ? (cushion > 0.005
          ? `Der Rhythmus startet im <b>${startLbl}</b>. Leg bis Ende ${fundBy} <b>${eur.format(cushion)}</b> aufs Rotierkonto – damit ist jede fällige Rechnung der nächsten ${winLen} Monate gedeckt, ohne dass das Konto ins Minus rutscht.`
          : `Der Rhythmus startet im <b>${startLbl}</b>. Ein Startpolster brauchst du nicht – die monatlichen Einzahlungen reichen aus.`)
      : (ist === null
          ? `Trag unten deinen aktuellen Kontostand ein, dann rechnet die App dir jeden Monat genau eine Überweisung aus. Solange kein Stand hinterlegt ist, siehst du den reinen Netto-Betrag der Spalte.`
          : `Soll-Stand Ende dieses Monats: <b>${eur.format(targetNow)}</b>, aktuell drauf: <b>${eur.format(ist)}</b>. Die Differenz ist deine Überweisung – Abweichungen aus Vormonaten sind darin schon ausgeglichen.`);

  const startInput = `${rotStartMk >= 0 ? String(Math.floor(rotStartMk / 12)).padStart(4, '0') : '0000'}-${String(rotStartMk % 12 + 1).padStart(2, '0')}`;
  const cfgRow = !hasIrr ? '' : `<div class="rot-cfg">
    <label>Rhythmus ab
      <input type="month" id="rot-start" value="${startInput}">
    </label>
    <label>Kontostand aktuell
      <input type="text" id="rot-bal" inputmode="decimal" placeholder="unbekannt"${ist !== null ? ` value="${String(ist).replace('.', ',')}"` : ''}>
    </label>
  </div>`;

  const actLbl = setupPhase ? `Bis Ende ${fundBy}` : 'Diesen Monat';
  const actBox = !hasIrr ? '' : `<div class="rot-action">
    <span class="rot-action-lbl">${actLbl}</span>
    <span class="rot-action-val ${action < -0.005 ? 'neg' : 'pos'}">${action >= 0 ? '+' : '−'}${eur.format(Math.abs(action) < 0.005 ? 0 : Math.abs(action))}</span>
    <span class="rot-action-hint">${action < -0.005 ? 'vom Rotierkonto aufs Gehaltskonto' : 'aufs Rotierkonto'}</span>
  </div>`;

  // ── Income rows ──
  const iRow = (trCls, lbl, cells) =>
    `<tr class="${trCls}"><td class="name"><span class="lbl">${lbl}</span></td>${cells}</tr>`;

  const inputCells = key => Array.from({ length: N }, (_, k) => {
    const mk  = startIdx + k;
    const cls = [isCur(k) ? 'cur' : '', isPast(k) ? 'past-col' : ''].filter(Boolean).join(' ');
    const v   = getInc(mk, key);
    return `<td class="${cls}"><input class="ic" data-key="${key}" data-col="${k}" type="text" inputmode="decimal" placeholder="–"${v ? ` value="${String(v).replace('.', ',')}"` : ''}></td>`;
  }).join('');

  const calcCells = key => Array.from({ length: N }, (_, k) => {
    const mk  = startIdx + k;
    const cls = [isCur(k) ? 'cur' : '', isPast(k) ? 'past-col' : ''].filter(Boolean).join(' ');
    return `<td class="${cls}" id="cc-${key}-${mk}">–</td>`;
  }).join('');

  let sepCells = '';
  for (let k = 0; k < N; k++) {
    const cls = [isCur(k) ? 'cur' : '', isPast(k) ? 'past-col' : ''].filter(Boolean).join(' ');
    sepCells += `<td class="${cls}"></td>`;
  }

  const incRows =
    `<tr class="inc-sep"><td class="name"><span class="lbl">Einnahmen &amp; Auszahlung</span></td>${sepCells}</tr>`
    + iRow('inc-input', 'Patrick Lohn',       inputCells('patrick'))
    + iRow('inc-input', 'Sara Lohn',          inputCells('sara'))
    + iRow('inc-input', 'Sonstige Einnahmen', inputCells('other'))
    + iRow('inc-calc',  'Gesamteinnahmen',    calcCells('total'))
    + iRow('inc-calc',  'Überschuss',         calcCells('surp'))
    + iRow('inc-calc muted', 'Überschuss / 2', calcCells('half'))
    + iRow('inc-input', 'Vormonat Sara',      inputCells('prevSara'))
    + iRow('inc-input', 'Vormonat Patrick',   inputCells('prevPatrick'))
    + iRow('inc-input', 'Sockel / Person',    inputCells('sockel'))
    + iRow('inc-calc remain', 'Verbleibend',  calcCells('remain'))
    + iRow('inc-payout', 'Sara erhält',       calcCells('sarap'))
    + iRow('inc-payout', 'Patrick erhält',    calcCells('patrickp'));

  lastTotals   = totals;    // all months so past-column lookups work
  lastStartIdx = startIdx; // absolute month index of column 0

  host.innerHTML = `<div class="forecast-wrap">
    <div class="forecast-head">
      <div>
        <h2>Prognose</h2>
        <span class="hint">← 6 Monate · aktueller Monat · Prognose 35 Monate →</span>
      </div>
      <div class="avg">
        <span class="avg-label">Rotierkonto · Ø / Monat</span>
        <span class="avg-val">${hasIrr ? eur.format(avgIrr) : '–'}</span>
      </div>
    </div>
    ${actBox}
    <div class="reserve-note">${note}</div>
    ${cfgRow}
    <div class="fc-scroll" id="fc-scroll">
      <table class="fc">
        <thead><tr>${head}</tr></thead>
        <tbody>
          ${body}
          <tr class="totals">${tot}</tr>
          <tr class="fc-avg">${avgRow}</tr>
          <tr class="rot-sep">${rotSep}</tr>
          <tr class="rot-ein">${rotEin}</tr>
          <tr class="rot-aus">${rotAus}</tr>
          <tr class="rot-net">${rotNet}</tr>
          <tr class="reserve">${rotRes}</tr>
          ${incRows}
        </tbody>
      </table>
    </div>
  </div>`;

  // Scroll to current month on first render
  requestAnimationFrame(() => {
    const scroll = $("fc-scroll");
    if (scroll) {
      const curTh = scroll.querySelector("th.cur");
      if (curTh) scroll.scrollLeft = curTh.offsetLeft - 120;
    }
  });

  // Fill computed income cells — all cols including past
  for (let k = 0; k < N; k++) updateIncomeCol(startIdx + k);

  // Attach income input listeners
  host.querySelectorAll('.ic').forEach(inp => {
    inp.addEventListener('input', () => {
      const mk = startIdx + parseInt(inp.dataset.col);
      setInc(mk, inp.dataset.key, parseFloat(inp.value.replace(/\./g, '').replace(',', '.')) || 0);
      persistIncome();
      updateIncomeCol(mk);
    });
  });

  // Rotierkonto config
  const rs = $("rot-start");
  if (rs) rs.addEventListener('change', async () => {
    rotCfg.start = /^\d{4}-\d{2}$/.test(rs.value) ? rs.value : "";
    await persistRotCfg();
    renderForecast();
  });

  const rb = $("rot-bal");
  if (rb) {
    const commit = async () => {
      const raw = rb.value.trim();
      rotCfg.balance = raw === "" ? null : (parseFloat(raw.replace(/\./g, '').replace(',', '.')) || 0);
      await persistRotCfg();
      renderForecast();
    };
    rb.addEventListener('change', commit);
    rb.addEventListener('keydown', e => { if (e.key === 'Enter') rb.blur(); });
  }
}

// ── Day log ────────────────────────────────────────────────────────────────
const dayKey  = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey = () => dayKey(new Date());
const shiftDay = (key, n) => {
  const [y, m, d] = key.split('-').map(Number);
  return dayKey(new Date(y, m - 1, d + n));
};
const dayLabel = (key, opts) => {
  const [y, m, d] = key.split('-').map(Number);
  return new Intl.DateTimeFormat("de-DE", opts || { weekday: "short", day: "numeric", month: "long" })
    .format(new Date(y, m - 1, d));
};
const getDay = key => daylog[key] || {};

// One entry covers a waking day plus the night that follows it, so any date
// shown for a night names both of its days — "Fr., 18. → Sa., 19. Sept."
const nightLabel = key =>
  `${dayLabel(key, { weekday: 'short', day: 'numeric' })} → ${dayLabel(shiftDay(key, 1), { weekday: 'short', day: 'numeric', month: 'short' })}`;
const morningLabel = key =>
  dayLabel(shiftDay(key, 1), { weekday: 'long', day: 'numeric', month: 'short' });

// Times are stored as plain HH:MM. Going to bed at 23:40 and settling at
// 01:20 crosses midnight, so a negative span wraps into the next day.
const minsOf = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
const fmtSpan = m => {
  if (m === null) return '';
  m = Math.round(m);                     // medians of even-sized groups land on halves
  const neg = m < 0, a = Math.abs(m);
  const s = a < 60 ? `${a} min` : `${Math.floor(a / 60)} h ${String(a % 60).padStart(2, '0')} min`;
  return neg ? `−${s}` : s;
};

// Span from bedtime to resting heart rate. With an explicit date the
// difference is exact; without one a time before bedtime is read as the
// following morning.
function restSpan(key, e) {
  if (!e.sleepAt || !e.restingHr) return null;
  const bed = new Date(`${key}T${e.sleepAt}:00`);
  const hr  = new Date(`${e.restingHrDate || key}T${e.restingHr}:00`);
  let d = Math.round((hr - bed) / 60000);
  if (!e.restingHrDate && d < 0) d += 1440;
  return d;
}

function writeDay(key, field, value) {
  const e = daylog[key] || (daylog[key] = {});
  if (value === null || value === "" || value === undefined) delete e[field];
  else e[field] = value;
  if (Object.keys(e).length === 0) delete daylog[key];
}

async function setDay(key, field, value) {
  writeDay(key, field, value);
  await persistDaylog();
  renderSleep();
}

// Time and date inputs must not trigger a full re-render: replacing the input
// mid-interaction closes the native picker. Only the derived parts refresh.
async function setDayTime(key, field, value) {
  writeDay(key, field, value);
  // Entering the resting time without a date: infer which morning it was
  if (field === 'restingHr' && value) {
    const e = getDay(key);
    if (!e.restingHrDate) {
      writeDay(key, 'restingHrDate',
        (e.sleepAt && value < e.sleepAt) ? shiftDay(key, 1) : key);
    }
  }
  await persistDaylog();
  refreshDerived();
}

// Refresh only what depends on the values, never the inputs themselves.
function refreshDerived() {
  const key  = sleepDay || todayKey();
  const e    = getDay(key);
  const span = $("sleep-span-slot");
  if (span) {
    const m = restSpan(key, e);
    span.innerHTML = m === null ? ''
      : `<div class="sleep-span">${esc(fmtSpan(m))} nach dem Zubettgehen</div>`;
  }
  const hist = $("sleep-hist-slot");
  if (hist) hist.innerHTML = sleepHistHtml(key);
  const date = $("sleep-hr-date");
  if (date && date.value !== (e.restingHrDate || '')) date.value = e.restingHrDate || '';
}

// Tri-state: clicking the active button clears the field again
function dayToggle(key, field, value) {
  setDay(key, field, getDay(key)[field] === value ? null : value);
}

function dayCups(key, field, delta) {
  const cur = getDay(key)[field] || 0;
  const next = Math.max(0, Math.min(30, cur + delta));
  setDay(key, field, next === 0 ? null : next);
}

function sleepHistHtml(key) {

  const mark = v => v === true ? '<i class="m-yes">✓</i>' : v === false ? '<i class="m-no">–</i>' : '<i class="m-un">·</i>';

          <td>${x.quality ? `<span class="q q-${x.quality}">${QUALS.find(q=>q.v===x.quality).l[0]}</span>` : '–'}</td>
          <td>${x.sleepAt ? esc(x.sleepAt) : '–'}</td>
          <td class="hr">${x.restingHr ? esc(x.restingHr) : '–'}${
            restSpan(d, x) === null ? ''
              : `<span class="sub">+${esc(fmtSpan(restSpan(d, x)))}</span>`}</td>
          <td>${x.foodTime ? esc(x.foodTime) : '–'}${x.foodType ? `<span class="ft ft-${x.foodType}">${x.foodType[0].toUpperCase()}</span>` : ''}</td>
          <td>${x.coffeeCups ? `${x.coffeeCups}×` : (x.coffee === false ? '–' : '')}${x.coffeeLast ? ` <span class="sub">${esc(x.coffeeLast)}</span>` : ''}</td>
          <td>${x.sportEnd ? esc(x.sportEnd) : '–'}</td>
          <td>${x.mastTime ? esc(x.mastTime) : mark(x.mast)}</td>
          <td>${mark(x.brainwork)}</td>

      }).join('')}</tbody>

// ── Demo data ──────────────────────────────────────────────────────────────
// Thirty plausible nights so the analysis can be judged before real logging
// starts. Every entry carries demo:true and can be removed again in one go.
function demoEntries() {
  let seed = 20260918;                       // fixed, so the demo never changes
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const noise = () => { let s = 0; for (let i = 0; i < 6; i++) s += rnd(); return (s - 3) / 0.707; };
  const pad = n => String(n).padStart(2, '0');
  const hhmm = m => { m = ((m % 1440) + 1440) % 1440; return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
  const out = {};

  let nightRun = 0;
  for (let back = 30; back >= 1; back--) {
    const key = shiftDay(todayKey(), -back);
    const [Y, M, D] = key.split('-').map(Number);
    const dow = new Date(Y, M - 1, D).getDay();          // 0 So … 6 Sa
    const weekend = dow === 5 || dow === 6;

    // Night shifts come in short runs, as they usually do in a rota
    let shift;
    if (nightRun > 0) { shift = 'nacht'; nightRun--; }
    else if (rnd() < 0.09) { shift = 'nacht'; nightRun = 1 + Math.floor(rnd() * 2); }
    else shift = rnd() < 0.22 ? 'spaet' : 'frueh';

    // After a night shift you go to bed in the morning
    const bed = shift === 'nacht' ? 7 * 60 + Math.floor(rnd() * 90)
      : shift === 'spaet' ? 23 * 60 + 40 + Math.floor(rnd() * 70)
      : weekend ? 23 * 60 + 15 + Math.floor(rnd() * 90)
      : 22 * 60 + 20 + Math.floor(rnd() * 75);

    const e = { demo: true, sleepAt: hhmm(bed), shift };

    // Coffee almost every day, later on late and night shifts
    const noCoffee = rnd() < 0.12;
    let cofGapH = null;
    if (!noCoffee) {
      const cups = 1 + Math.floor(rnd() * (shift === 'frueh' ? 3 : 4));
      const last = shift === 'nacht' ? 2 * 60 + Math.floor(rnd() * 180)
        : shift === 'spaet' ? 15 * 60 + Math.floor(rnd() * 240)
        : 9 * 60 + Math.floor(rnd() * 480);
      e.coffee = true; e.coffeeCups = cups; e.coffeeLast = hhmm(last);
      e.coffeeType = ['filter', 'cappuccino', 'unterwegs'][Math.floor(rnd() * 3)];
      cofGapH = (((bed - last) % 1440) + 1440) % 1440 / 60;
    } else e.coffee = false;

    // Dinner, heavier and later at the weekend
    const foodAt = (weekend ? 19 * 60 + 30 : 18 * 60 + 30) + Math.floor(rnd() * 120);
    e.foodTime = hhmm(shift === 'nacht' ? 1 * 60 + Math.floor(rnd() * 120) : foodAt);
    e.foodType = rnd() < (weekend ? 0.45 : 0.25) ? 'fettig' : rnd() < 0.3 ? 'scharf' : 'leicht';

    // Alcohol mostly at the weekend
    let alcRest = 0;
    if (rnd() < (weekend ? 0.55 : 0.12)) {
      const units = 1 + Math.floor(rnd() * 3);
      const last = 20 * 60 + Math.floor(rnd() * 180);
      e.alcohol = true; e.alcUnits = units; e.alcLast = hhmm(last);
      alcRest = Math.max(0, units - ((((bed - last) % 1440) + 1440) % 1440) / 60);
    } else e.alcohol = false;

    // Sport two or three times a week, sauna now and then
    if (rnd() < 0.38) { e.sport = true; e.sportEnd = hhmm(17 * 60 + Math.floor(rnd() * 210)); }
    else e.sport = false;
    let saunaGapH = null;
    if (rnd() < 0.13) {
      const end = 18 * 60 + Math.floor(rnd() * 210);
      e.sauna = true; e.saunaEnd = hhmm(end);
      saunaGapH = ((((bed - end) % 1440) + 1440) % 1440) / 60;
    } else e.sauna = false;

    e.brainwork = rnd() < (shift === 'frueh' ? 0.3 : 0.5);
    e.relaxed   = rnd() < 0.55;
    if (rnd() < 0.3) { e.mast = true; e.mastTime = hhmm(bed - 10 - Math.floor(rnd() * 70)); }
    else e.mast = false;

    // The settling span: a few real effects, plus day-to-day noise that keeps
    // most of them short of proof at thirty nights — which is the honest picture.
    let span = 58 + noise() * 15;
    if (shift === 'nacht') span += 40;
    if (cofGapH !== null && cofGapH < 5) span += 26;
    span += alcRest * 20;
    if (saunaGapH !== null && saunaGapH < 2) span += 30;
    if (e.brainwork) span += 9;
    span = Math.max(18, Math.round(span));

    // The night rolls over only when the clock time falls back past bedtime,
    // which is not the same as the raw minute count passing 1440
    const bedClock = ((bed % 1440) + 1440) % 1440;
    const hrClock  = (((bed + span) % 1440) + 1440) % 1440;
    e.restingHr = hhmm(hrClock);
    e.restingHrDate = hrClock < bedClock ? shiftDay(key, 1) : key;

    // The rating follows the body loosely — people misjudge their own nights
    if (rnd() > 0.1) {
      const noisy = span + noise() * 22;
      e.quality = noisy < 68 ? 'gut' : noisy < 100 ? 'mittel' : 'schlecht';
    }
    out[key] = e;
  }
  return out;
}

const hasDemo = () => Object.values(daylog).some(e => e && e.demo);

async function loadDemo() {
  const real = Object.entries(daylog).filter(([, e]) => e && !e.demo).length;
  const warn = real ? `\n\nAchtung: ${real} eigene Einträge bleiben erhalten, die Auswertung mischt sie dann mit den Beispieltagen.` : '';
  const sync = ghReady() ? '\n\nSync ist aktiv — die Beispieldaten landen auch auf GitHub.' : '';
  if (!confirm(`30 Beispieltage laden?${warn}${sync}\n\nDu kannst sie jederzeit wieder entfernen.`)) return;
  Object.assign(daylog, demoEntries());
  await persistDaylog();
  renderSleep();
  showToast('30 Beispieltage geladen');
}

async function clearDemo() {
  if (!confirm('Alle Beispieltage entfernen? Eigene Einträge bleiben.')) return;
  Object.keys(daylog).forEach(k => { if (daylog[k] && daylog[k].demo) delete daylog[k]; });
  await persistDaylog();
  renderSleep();
  showToast('Beispieltage entfernt');
}

// ── Live logging ───────────────────────────────────────────────────────────
// Tapping records the current clock time, so nothing has to be reconstructed
// in bed later. The logbook day rolls over at 05:00, not at midnight: a tap
// at 00:30 belongs to the day whose evening it still is.
let sleepMode = 'live';     // 'live' | 'form'
let liveDay   = null;       // null = whichever day the clock says

function logDayKey() {
  const d = new Date();
  if (d.getHours() < 5) d.setDate(d.getDate() - 1);
  return dayKey(d);
}
const liveKey = () => liveDay || logDayKey();
const nowHHMM = () => {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};

];

async function liveTap(k) {
  const act = LIVE.find(a => a.k === k);
  if (!act) return;
  const key = liveKey(), t = nowHHMM();
  const patch = act.setTime ? { [act.setTime]: t } : act.set(getDay(key), t);
  Object.entries(patch).forEach(([f, v]) => writeDay(key, f, v));
  await persistDaylog();
  renderSleep();
  showToast(`${act.l} · ${t}`);
}

async function liveClear(k) {
  const act = LIVE.find(a => a.k === k);
  if (!act) return;
  const key = liveKey();
  act.clear.forEach(f => writeDay(key, f, null));
  await persistDaylog();
  renderSleep();
}

async function liveSleep() {
  const key = liveKey(), t = nowHHMM();
  writeDay(key, 'sleepAt', t);
  await persistDaylog();
  renderSleep();
  showToast(`Augen zu · ${t}`);
}

async function liveToggle(field, value) {
  const key = liveKey();
  writeDay(key, field, getDay(key)[field] === value ? null : value);
  await persistDaylog();
  renderSleep();
}

function setSleepMode(m) { sleepMode = m; renderSleep(); }
function liveGo(n) { liveDay = shiftDay(liveKey(), n); renderSleep(); }
function liveNow() { liveDay = null; renderSleep(); }

    <div id="sleep-span-slot">${restSpan(key, e) === null ? ''

// ── Analysis ───────────────────────────────────────────────────────────────
// Everything here is a counted median over real nights. No models, no
// estimates: each number is "the middle night of this group", nothing more.
// Diverging poles validated for colour-vision deficiency (protan ΔE 20.0);
// the app's green/red pair fails that check and is deliberately not used.
const CH_GOOD = "#3b6fb0";
const CH_BAD  = "#c2783f";
const CH_MUTE = "#9aa19e";

const MIN_BIN = 8;     // nights per group before a comparison is worth reading

let statsY = "span";
let hideNight = false;   // night shifts out of every view at once

const median = a => {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), h = s.length >> 1;
  return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
};

// Minutes between something earlier in the day and closing your eyes.
// Everything is measured against that moment, never against the wall clock,
// so a cup six hours before counts the same at 23:00 and at 07:00.
function gapToBed(e, field) {
  if (!e.sleepAt || !e[field]) return null;
  let d = minsOf(e.sleepAt) - minsOf(e[field]);
  if (d < 0) d += 1440;
  return d > 20 * 60 ? null : d;
}

const OUTCOMES = [
  { k: 'span', l: 'Einschlafphase', lowGood: true,
    get: r => r.span, fmt: v => fmtSpan(v),
    // Axis ticks need to fit in a narrow margin, so 2:35 rather than 2 h 35 min
    tick: v => { const m = Math.round(v); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; } },
  { k: 'quality', l: 'Nachtgefühl', lowGood: false,
    get: r => r.e.quality ? QUAL_SCORE[r.e.quality] : null,
    fmt: v => (v < 0 ? '−' : '') + Math.abs(v).toFixed(2),
    tick: v => (v < 0 ? '−' : '') + Math.abs(v).toFixed(1) }
];
const outcome = () => OUTCOMES.find(o => o.k === statsY) || OUTCOMES[0];
function setStatsY(k) { statsY = k; renderStats(); }
function toggleNight() { hideNight = !hideNight; renderStats(); }

function statRows() {
  return Object.keys(daylog).sort().map(d => {
    const e = getDay(d), span = restSpan(d, e);
    return { d, e, span };
  }).filter(r => r.span !== null && r.span >= 0 && r.span <= 15 * 60)
    .filter(r => !hideNight || r.e.shift !== 'nacht');
}

// Timed factors, binned by how long before lights-out they happened
const WINDOWS = [
  { k: 'coffeeLast', l: 'Letzte Tasse Kaffee', off: e => e.coffee === false,
    edges: [5, 10], labels: ['< 5 Std. vorher', '5–10 Std. vorher', '> 10 Std. vorher'], none: 'kein Kaffee' },
  { k: 'alcLast', l: 'Letzter Alkohol', off: e => e.alcohol === false,
    edges: [3, 6], labels: ['< 3 Std. vorher', '3–6 Std. vorher', '> 6 Std. vorher'], none: 'kein Alkohol' },
  { k: 'foodTime', l: 'Letztes Essen', off: () => false,
    edges: [2, 4], labels: ['< 2 Std. vorher', '2–4 Std. vorher', '> 4 Std. vorher'], none: null },
  { k: 'sportEnd', l: 'Sport-Ende', off: e => e.sport === false,
    edges: [3, 6], labels: ['< 3 Std. vorher', '3–6 Std. vorher', '> 6 Std. vorher'], none: 'kein Sport' },
  { k: 'saunaEnd', l: 'Letzter Saunagang', off: e => e.sauna === false,
    edges: [2, 5], labels: ['< 2 Std. vorher', '2–5 Std. vorher', '> 5 Std. vorher'], none: 'keine Sauna' },
  { k: 'mastTime', l: 'Masturbation', off: e => e.mast === false,
    edges: [1, 3], labels: ['< 1 Std. vorher', '1–3 Std. vorher', '> 3 Std. vorher'], none: 'gar nicht' }
];

// Factors with no time of their own
const GROUPS = [
  { l: 'Dienst',    get: e => e.shift,     levels: SHIFTS },
  { l: 'Brainwork', get: e => e.brainwork, levels: [{ v: true, l: 'Ja' }, { v: false, l: 'Nein' }] },
  { l: 'Art des Essens', get: e => e.foodType,   levels: FOOD_TYPES },
  { l: 'Art des Kaffees', get: e => e.coffeeType, levels: COFFEE_TYPES },
  { l: 'Entspannt ins Bett', get: e => e.relaxed, levels: [{ v: true, l: 'Ja' }, { v: false, l: 'Nein' }] }
];

// Pairs, for the combination view. Each factor collapses to "critical or not"
// so two of them make four cells instead of nine — with thirty-odd nights
// that is the difference between readable and empty.
const COMBOS = [
  { k: 'coffee', l: 'Kaffee < 5 Std. vorher',
    on: e => e.coffee === false ? false : nearBed(e, 'coffeeLast', 300) },
  { k: 'alc',   l: 'Alkohol getrunken',
    on: e => e.alcohol === true ? true : e.alcohol === false ? false : null },
  { k: 'food',  l: 'Essen < 2 Std. vorher',  on: e => nearBed(e, 'foodTime', 120) },
  { k: 'fat',   l: 'Fettig gegessen',
    on: e => e.foodType ? e.foodType === 'fettig' : null },
  { k: 'sport', l: 'Sport < 3 Std. vorher',
    on: e => e.sport === false ? false : nearBed(e, 'sportEnd', 180) },
  { k: 'sauna', l: 'Sauna < 2 Std. vorher',
    on: e => e.sauna === false ? false : nearBed(e, 'saunaEnd', 120) },
  { k: 'mast',  l: 'Masturbation < 1 Std. vorher',
    on: e => e.mast === false ? false : nearBed(e, 'mastTime', 60) },
  { k: 'brain', l: 'Brainwork davor',
    on: e => e.brainwork === true ? true : e.brainwork === false ? false : null },
  { k: 'nacht', l: 'Nachtdienst',
    on: e => e.shift ? e.shift === 'nacht' : null },
  { k: 'spaet', l: 'Spätdienst',
    on: e => e.shift ? e.shift === 'spaet' : null }
];
function nearBed(e, field, mins) {
  const g = gapToBed(e, field);
  return g === null ? null : g < mins;
}

function renderStats() {
  const host = $("stats");
  const rows = statRows();
  const N = rows.length;

  if (N < 2) {
    host.innerHTML = `<div class="stats-empty">
      <b>Noch zu wenig Daten</b>
      <p>Die Auswertung braucht Nächte mit <i>Schlafen gegangen</i> und <i>Ruhepuls erreicht</i>.
      Bisher: <b>${N}</b>.</p>
      <p>Große Unterschiede zeigen sich ab etwa 25 Nächten, feine brauchen deutlich mehr.</p>
      <button class="demo-btn" onclick="loadDemo()">30 Beispieltage laden</button>
    </div>`;
    return;
  }

  const spans = rows.map(r => r.span);
  const med = median(spans);
  const rated = rows.filter(r => r.e.quality).length;

  const kpi = `<div class="kpi-row">
    ${[['Nächte', String(N), ''],
       ['Median', fmtSpan(med), 'bis zum Ruhepuls'],
       ['Kürzeste', fmtSpan(Math.min(...spans)), ''],
       ['Bewertet', String(rated), 'von ' + N + ' Nächten']].map(([l, v, s]) => `
      <div class="kpi"><span class="kpi-lbl">${l}</span><span class="kpi-val">${esc(v)}</span>
      ${s ? `<span class="kpi-sub">${esc(s)}</span>` : ''}</div>`).join('')}
  </div>`;

  const ySwitch = `<div class="ytabs">${OUTCOMES.map(o =>
    `<button class="ytab ${o.k === statsY ? 'on' : ''}" onclick="setStatsY('${o.k}')">${o.l}</button>`
  ).join('')}</div>`;

  const nights = Object.keys(daylog).filter(k => (daylog[k] || {}).shift === 'nacht').length;
  const filter = nights === 0 ? '' : `<label class="nfilter">
    <input type="checkbox" ${hideNight ? 'checked' : ''} onchange="toggleNight()">
    Nachtdienste ausblenden <span>(${nights} erfasst)</span>
  </label>`;

  host.innerHTML = kpi + ySwitch + filter + timelineChart(rows, med)
    + feelVsBody(rows) + compareSection(rows) + comboSection(rows);
}

function feelVsBody(rows) {
  const have = rows.filter(r => r.e.quality);
  if (have.length < 4) {
    return `<h3 class="stats-h3">Gefühl gegen Körper</h3>
      <p class="stats-sub">Bewerte die Nächte am Morgen, dann steht hier, ob dein Empfinden
      mit der gemessenen Einschlafphase zusammenpasst. Bisher ${have.length} bewertet.</p>`;
  }
  const byQ = QUALS.map(q => {
    const v = have.filter(r => r.e.quality === q.v).map(r => r.span);
    return { ...q, n: v.length, med: v.length ? median(v) : null };
  });
  const filled = byQ.filter(q => q.med !== null);
  const max = Math.max(...filled.map(q => q.med), 1);
  const gut = byQ.find(q => q.v === 'gut'), schl = byQ.find(q => q.v === 'schlecht');

  const verdict = (gut.med !== null && schl.med !== null)
    ? (schl.med - gut.med > 15
        ? `Dein Gefühl passt zum Körper: nach gefühlt guten Nächten war der Ruhepuls im Mittel
           <b>${esc(fmtSpan(schl.med - gut.med))}</b> früher erreicht als nach schlechten.`
        : schl.med - gut.med < -15
          ? `Auffällig: gefühlt <b>gute</b> Nächte hatten die <b>längere</b> Einschlafphase.
             Dein Empfinden misst also etwas anderes als der Puls.`
          : `Gefühl und Körper laufen bei dir <b>auseinander</b> — zwischen guten und schlechten
             Nächten liegen nur ${esc(fmtSpan(Math.abs(schl.med - gut.med)))}. Beide Größen lohnen getrennt.`)
    : `Sobald du gute und schlechte Nächte beide bewertet hast, steht hier der Vergleich.`;

  return `
    <h3 class="stats-h3">Gefühl gegen Körper</h3>
    <p class="stats-sub">Mittlere Einschlafphase je Bewertung.</p>
    <div class="qbars">${byQ.map(q => q.med === null
      ? `<div class="qbar empty"><span class="qbar-l">${q.l}</span><span class="qbar-n">noch keine</span></div>`
      : `<div class="qbar">
           <span class="qbar-l"><span class="q q-${q.v}">${q.l[0]}</span>${q.l}</span>
           <span class="qbar-track"><span class="qbar-fill" style="width:${(q.med / max * 100).toFixed(1)}%;background:${q.v === 'gut' ? CH_GOOD : q.v === 'schlecht' ? CH_BAD : CH_MUTE}"></span></span>
           <span class="qbar-v">${esc(fmtSpan(q.med))}<span class="qbar-n">n=${q.n}</span></span>
         </div>`).join('')}</div>
    <p class="stats-note">${verdict}</p>`;
}

// One dot per night, stacked where they land close together. At enough nights
// the pile takes on a bell shape by itself; at few nights it stays a handful
// of dots, which is honest — a smooth curve drawn through eight values would
// show a shape the data does not contain.
function dotStrip(vals, xMax, colour) {
  const W = 100, H = 26, pad = 2.5;
  const B = 44;                                  // buckets across the strip
  const seen = {};
  const pts = vals.map(v => {
    const b = Math.max(0, Math.min(B - 1, Math.round(v / xMax * (B - 1))));
    const tier = (seen[b] = (seen[b] || 0) + 1) - 1;
    return { x: pad + (b / (B - 1)) * (W - 2 * pad), tier };
  });
  const maxTier = Math.max(0, ...pts.map(p => p.tier));
  const step = Math.min(3.6, (H / 2 - 3.2) / Math.max(1, Math.ceil(maxTier / 2)));
  const cy = H / 2;
  const med = median(vals);
  const mx = pad + (Math.max(0, Math.min(1, med / xMax))) * (W - 2 * pad);

  return `<svg class="dstrip" viewBox="0 0 ${W} ${H}" role="img">
    <line x1="${mx.toFixed(2)}" x2="${mx.toFixed(2)}" y1="1" y2="${H - 1}"
          stroke="${colour}" stroke-width="0.7" opacity=".85"/>
    ${pts.map(p => {
      const dir = p.tier % 2 ? 1 : -1, lvl = Math.ceil(p.tier / 2);
      return `<circle cx="${p.x.toFixed(2)}" cy="${(cy + dir * lvl * step).toFixed(2)}"
        r="1.7" fill="${colour}" fill-opacity=".75"/>`;
    }).join('')}
  </svg>`;
}

// One block per factor: the middle night of each group, counted, side by side
function compareSection(rows) {
  const O = outcome();
  const use = rows.filter(r => O.get(r) !== null);
  if (use.length < 6) {
    return `<h3 class="stats-h3">Vergleich</h3>
      <p class="stats-sub">Dafür braucht es mindestens sechs auswertbare Nächte.</p>`;
  }
  const overall = median(use.map(r => O.get(r)));
  const yDom = Math.max(...use.map(r => O.get(r))) * 1.06 || 1;

  const blocks = [];

  // Timed factors: the whole night plotted against how long before it happened
  WINDOWS.forEach(w => {
    const pts = [], skipped = [];
    use.forEach(r => {
      if (w.none && w.off(r.e)) { skipped.push(O.get(r)); return; }
      const g = gapToBed(r.e, w.k);
      if (g !== null) pts.push({ x: g / 60, y: O.get(r), d: r.d, e: r.e });
    });
    if (pts.length < 4) return;

    // Bin medians still go underneath as plain numbers
    const bins = w.labels.map((l, i) => ({ l, v: pts.filter(p => {
      const h = p.x;
      return i === 0 ? h < w.edges[0] : i === 1 ? (h >= w.edges[0] && h < w.edges[1]) : h >= w.edges[1];
    }).map(p => p.y) })).filter(b => b.v.length);
    const spread = bins.length > 1
      ? Math.max(...bins.map(b => median(b.v))) - Math.min(...bins.map(b => median(b.v))) : 0;

    blocks.push({
      spread, thin: pts.length < MIN_BIN,
      html: scatterBlock(w, pts, skipped, yDom, overall, O, bins)
    });
  });

  // Factors without a time of their own keep the stacked dots
  GROUPS.forEach(g => {
    const cells = g.levels.map(lv => ({ l: lv.l, rows: use.filter(r => g.get(r.e) === lv.v) }))
      .filter(c => c.rows.length > 0);
    if (cells.length < 2) return;
    const stat = cells.map(c => ({ ...c, n: c.rows.length, med: median(c.rows.map(r => O.get(r))) }));
    const lo = Math.min(...stat.map(s => s.med)), hi = Math.max(...stat.map(s => s.med));
    const bars = stat.map(s => {
      const good = O.lowGood ? s.med <= overall : s.med >= overall;
      const c = s.n < 3 ? CH_MUTE : (good ? CH_GOOD : CH_BAD);
      return `<div class="wbar">
        <span class="wbar-l">${esc(s.l)}</span>
        ${dotStrip(s.rows.map(r => O.get(r)), yDom, c)}
        <span class="wbar-v" style="color:${c}">${esc(O.fmt(s.med))}<span class="wbar-n">${s.n} Nächte</span></span>
      </div>`;
    }).join('');
    blocks.push({
      spread: hi - lo, thin: Math.min(...stat.map(s => s.n)) < MIN_BIN,
      html: `<div class="wblock">
        <div class="wblock-head"><span class="wblock-t">${esc(g.l)}</span>
          <span class="wblock-s">Unterschied ${esc(O.fmt(hi - lo))}</span></div>
        ${bars}
        <div class="wscale"><span>0</span><span>${esc(O.fmt(yDom / 2))}</span><span>${esc(O.fmt(yDom))}</span></div>
      </div>` }); 
  });

  if (!blocks.length) {
    return `<h3 class="stats-h3">Vergleich</h3>
      <p class="stats-sub">Noch keine Faktoren mit genug Nächten.</p>`;
  }
  blocks.sort((a, b) => (a.thin - b.thin) || (b.spread - a.spread));

  return `
    <h3 class="stats-h3">Vergleich</h3>
    <p class="stats-sub">Ein Punkt ist eine Nacht. Waagerecht, wie lange vor dem Augen-zumachen
      es passiert ist, senkrecht die Einschlafphase dieser Nacht. Die Linie ist der gleitende
      Mittelwert — wo sie steigt, wird es teuer.</p>
    <div class="wblocks">${blocks.map(b => b.html).join('')}</div>
    <p class="stats-note">Jeder Faktor steht für sich. Ob zwei davon bei dir zusammenhängen,
      siehst du weiter unten unter <b>Kombination</b>.</p>`;
}

// Scatter of one timed factor, with a running median through the cloud
function scatterBlock(w, pts, skipped, yDom, overall, O, bins) {
  const W = 100, H = 60, L = 17, B = 8, T = 3;
  const xMax = Math.max(...pts.map(p => p.x), 1) * 1.05;
  const sx = v => L + (v / xMax) * (W - L - 3);
  const sy = v => (H - B) - (v / yDom) * (H - B - T);

  // Running median over the nearest neighbours — no curve is invented where
  // there are no nights, and one outlier cannot drag the line
  const sorted = [...pts].sort((a, b) => a.x - b.x);
  const k = Math.max(3, Math.round(sorted.length / 4));
  const line = sorted.map((_, i) => {
    const from = Math.max(0, i - (k >> 1)), win = sorted.slice(from, from + k);
    return { x: sorted[i].x, y: median(win.map(p => p.y)) };
  });
  const path = line.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(2)},${sy(p.y).toFixed(2)}`).join(' ');

  const ticks = [0, yDom / 2, yDom].map(v => `
    <line x1="${L}" x2="${W}" y1="${sy(v).toFixed(2)}" y2="${sy(v).toFixed(2)}"
          stroke="var(--line)" stroke-width="0.2"/>
    <text x="${L - 1.5}" y="${(sy(v) + 1.1).toFixed(2)}" text-anchor="end"
          font-size="3" fill="var(--muted)">${esc((O.tick || O.fmt)(v))}</text>`).join('');

  const none = skipped.length >= 3 ? median(skipped) : null;
  const noneLine = none === null ? '' : `
    <line x1="${L}" x2="${W}" y1="${sy(none).toFixed(2)}" y2="${sy(none).toFixed(2)}"
          stroke="${CH_MUTE}" stroke-width="0.45" stroke-dasharray="1.6 1.4"/>`;

  const dots = pts.map(p => {
    const good = O.lowGood ? p.y <= overall : p.y >= overall;
    return `<circle cx="${sx(p.x).toFixed(2)}" cy="${sy(p.y).toFixed(2)}" r="1.6"
      fill="${good ? CH_GOOD : CH_BAD}" fill-opacity=".8" stroke="#fff" stroke-width="0.4"
      ><title>${esc(dayLabel(p.d, { day: 'numeric', month: 'short' }))} · ${p.x.toFixed(1)} Std. vorher · ${esc(O.fmt(p.y))}</title></circle>`;
  }).join('');

  const xt = [0, xMax / 2, xMax].map(v =>
    `<span>${v.toFixed(v < 10 ? 1 : 0)}</span>`).join('');

  return `<div class="wblock">
    <div class="wblock-head">
      <span class="wblock-t">${esc(w.l)}</span>
      <span class="wblock-s">${pts.length} Nächte${none !== null ? ` · ${skipped.length} ohne` : ''}</span>
    </div>
    <svg class="sblock" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(w.l)}">
      ${ticks}${noneLine}
      <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="0.7"
            stroke-linejoin="round" opacity=".7"/>
      ${dots}
    </svg>
    <div class="sxaxis">${xt}</div>
    <div class="sxlbl">Stunden vor dem Augen-zumachen${none === null ? ''
      : ` · <span class="dash"></span> ${esc(w.none)}: ${esc(O.fmt(none))}`}</div>
    <div class="sbins">${bins.map(b =>
      `<span><b>${esc(O.fmt(median(b.v)))}</b> ${esc(b.l.replace(' vorher', ''))} <i>${b.v.length}</i></span>`
    ).join('')}</div>
  </div>`;
}

// Two factors at once: the four combinations side by side
let comboA = 'coffee', comboB = 'brain';
function setCombo(which, k) { if (which === 'a') comboA = k; else comboB = k; renderStats(); }

function comboSection(rows) {
  const O = outcome();
  const use = rows.filter(r => O.get(r) !== null);
  const list = COMBOS.filter(c => !(hideNight && c.k === 'nacht'));
  const A = list.find(c => c.k === comboA) || list[0];
  const B = list.find(c => c.k === comboB) || list[1];
  if (!A || !B) return '';

  const sel = (which, cur, other) => `<select onchange="setCombo('${which}',this.value)">
    ${list.map(c => `<option value="${c.k}"${c.k === cur.k ? ' selected' : ''}
      ${c.k === other.k ? ' disabled' : ''}>${esc(c.l)}</option>`).join('')}
  </select>`;

  let body;
  if (A.k === B.k) {
    body = `<p class="stats-sub">Wähle zwei verschiedene Faktoren.</p>`;
  } else {
    const cell = (a, b) => {
      const v = use.filter(r => A.on(r.e) === a && B.on(r.e) === b).map(r => O.get(r));
      return { n: v.length, med: v.length ? median(v) : null };
    };
    const grid = [[cell(true, true), cell(true, false)], [cell(false, true), cell(false, false)]];
    const all = grid.flat().filter(c => c.med !== null);
    if (all.length < 2) {
      body = `<p class="stats-sub">Für diese Kombination fehlen noch Nächte.</p>`;
    } else {
      const lo = Math.min(...all.map(c => c.med)), hi = Math.max(...all.map(c => c.med));
      const paint = c => {
        if (c.med === null) return `<td class="empty">–</td>`;
        const t = hi - lo < 1e-9 ? 0.5 : (c.med - lo) / (hi - lo);
        const col = c.n < 3 ? CH_MUTE : (O.lowGood ? (t > 0.5 ? CH_BAD : CH_GOOD) : (t > 0.5 ? CH_GOOD : CH_BAD));
        return `<td style="color:${col}"><b>${esc(O.fmt(c.med))}</b><span>${c.n} Nächte</span></td>`;
      };
      body = `
        <div class="combo-wrap"><table class="combo">
          <thead><tr><th></th>
            <th>${esc(B.l)}<br><i>ja</i></th><th>${esc(B.l)}<br><i>nein</i></th></tr></thead>
          <tbody>
            <tr><th>${esc(A.l)}<br><i>ja</i></th>${paint(grid[0][0])}${paint(grid[0][1])}</tr>
            <tr><th>${esc(A.l)}<br><i>nein</i></th>${paint(grid[1][0])}${paint(grid[1][1])}</tr>
          </tbody>
        </table></div>
        <p class="stats-note">Oben links stehen die Nächte, an denen <b>beides</b> zutraf,
          unten rechts die mit <b>keinem von beidem</b>. Nur wenn oben links deutlich schlechter
          steht als die beiden Einzelfelder, verstärken sich die zwei gegenseitig.
          Felder unter drei Nächten sind grau.</p>`;
    }
  }

  return `
    <h3 class="stats-h3">Kombination</h3>
    <p class="stats-sub">Zwei Faktoren zusammen — hier siehst du auch, ob zwei Dinge
      bei dir immer gemeinsam auftreten und sich deshalb nicht trennen lassen.</p>
    <div class="combo-sel">${sel('a', A, B)}${sel('b', B, A)}</div>
    ${body}`;
}

function timelineChart(rows, med) {
  const data = rows.slice(-30);
  const W = 100, H = 46, pad = 2;
  const hi = Math.max(...data.map(r => r.span), med) * 1.08;
  const bw = (W - pad * 2) / data.length;
  const y = v => H - (v / hi) * (H - 8);
  const bars = data.map((r, i) => {
    const x = pad + i * bw, h = Math.max(0.6, H - y(r.span));
    return `<rect x="${(x + bw * .14).toFixed(2)}" y="${y(r.span).toFixed(2)}"
      width="${(bw * .72).toFixed(2)}" height="${h.toFixed(2)}" rx="0.7"
      fill="${r.span > med ? CH_BAD : CH_GOOD}"
      ><title>${esc(dayLabel(r.d, { weekday: 'short', day: 'numeric', month: 'short' }))} · ${esc(fmtSpan(r.span))}${
        r.e.quality ? ' · ' + esc(QUALS.find(q => q.v === r.e.quality).l) : ''}</title></rect>`;
  }).join('');
  const first = data[0], last = data[data.length - 1];
  return `
    <h3 class="stats-h3">Einschlafphase pro Nacht</h3>
    <p class="stats-sub">Vom Augen-zumachen bis zum Ruhepuls.</p>
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="Einschlafphase je Nacht">
      <line x1="0" x2="${W}" y1="${y(med).toFixed(2)}" y2="${y(med).toFixed(2)}"
            stroke="${CH_MUTE}" stroke-width="0.3" stroke-dasharray="1.2 1.2"/>
      ${bars}
    </svg>
    <div class="chart-axis">
      <span>${esc(dayLabel(first.d, { day: 'numeric', month: 'short' }))}</span>
      <span class="med-tag">Median ${esc(fmtSpan(med))}</span>
      <span>${esc(dayLabel(last.d, { day: 'numeric', month: 'short' }))}</span>
    </div>`;
}

function fcCellClick(subId, yymm) {
  const pay = getPayment(subId, yymm);
  if (pay) {
    // navigate to transactions tab and that month's transaction
    txGoToLinked(pay.txId);
  } else {
    // navigate to transactions tab for that month
    const [y, m] = yymm.split("-").map(Number);
    const now2   = new Date();
    const diff   = (y - now2.getFullYear()) * 12 + (m - 1 - now2.getMonth());
    txMonthOffset = Math.min(0, diff);
    document.querySelectorAll(".tab-btn").forEach(b => {
      if (b.dataset.tab === "tx") b.click();
    });
  }
}

// ── Account config ─────────────────────────────────────────────────────────
function openAccConfig() {
  document.querySelectorAll(".acc-cfg-popup,[data-scrim]").forEach(p => p.remove());
  const detectedNums = [...new Set(transactions.map(t => t.accountNumber).filter(Boolean))];
  const detectedHtml = detectedNums.length
    ? `<div style="margin-top:14px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.01em">Erkannte Kontonummern</div>
       ${detectedNums.map(n => {

// ── Transactions ───────────────────────────────────────────────────────────
function parseTxAmount(str) {
  if (!str) return 0;
  const clean = str.replace(/\s/g, "").replace("€", "").replace(/\./g, "").replace(",", ".");
  return parseFloat(clean) || 0;
}

function parseTxDate(str) {
  if (!str) return "";
  const m = str.match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  if (!m) return "";
  return `${m[3]}-${m[2]}-${m[1]}`;
}

function txFingerprint(t) {
  return `${t.date}|${t.amount}|${t.payee}|${t.accountNumber}`.toLowerCase().trim();
}

function parseTransactionData(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = lines[0].split("\t").map(h => h.trim());
  const col = h => headers.indexOf(h);
  const result = [];
  lines.slice(1).forEach(line => {
    if (!line.trim()) return;
    const c = line.split("\t");
    const get = h => { const i = col(h); return i >= 0 ? (c[i] || "").trim() : ""; };
    const amount = parseTxAmount(get("Betrag"));
    const date   = parseTxDate(get("Buchungsdatum"));
    const t = {
      id: null,
      type: get("Transaktionstyp"),
      date,
      amount,
      payee: get("Zahlungsempfänger"),
      iban: get("IBAN"),
      purpose: (get("Verwendungszweck") || get("Beschreibung")),
      accountNumber: get("Kontonummer"),
      accountName: get("Kontoname"),
      c24Cat: get("Kategorie") || "Sonstiges",
      userCat: null,
    };
    t.fp = txFingerprint(t);
    result.push(t);
  });
  return result;
}

function importTxData(text) {
  const parsed = parseTransactionData(text);
  if (!parsed.length) { showToast("Keine Transaktionen erkannt"); return { added: 0, skipped: 0, months: [] }; }
  const existing = new Set(transactions.map(t => t.fp));
  let added = 0, skipped = 0;
  const newMonths = new Set();
  parsed.forEach(t => {
    if (existing.has(t.fp)) { skipped++; return; }
    t.id = "t" + Date.now() + Math.random().toString(36).slice(2, 5);
    transactions.push(t);
    existing.add(t.fp);
    if (t.date) newMonths.add(t.date.slice(0, 7));
    added++;
  });
  transactions.sort((a, b) => b.date.localeCompare(a.date));
  persistTransactions();
  return { added, skipped, months: [...newMonths].sort() };
}

function txEffectiveCat(t) {
  return t.userCat || t.c24Cat || "Sonstiges";
}

function txIsTransfer(t) {
  if (t.userCat && t.userCat !== "Umbuchung") return false;
  return t.type === "Pocket-Umbuchung" || t.c24Cat === "Umbuchung" || t.userCat === "Umbuchung";
}

function catmgrRefresh() {

function catmgrRename(oldCat) {
  const newName = prompt(`Kategorie umbenennen:`, oldCat);
  if (!newName) return;
  const val = newName.trim();
  if (!val || val === oldCat) return;
  const ui = txUserCats.indexOf(oldCat);
  if (ui > -1) txUserCats[ui] = val;
  else txUserCats.push(val);
  transactions.forEach(t => { if (t.userCat === oldCat) t.userCat = val; });
  persistTxCats();
  persistTransactions();
  catmgrRefresh();
}

function catmgrDelete(cat) {
  if (!confirm(`Kategorie "${cat}" löschen? Betroffene Transaktionen werden auf "Sonstiges" gesetzt.`)) return;
  txUserCats = txUserCats.filter(c => c !== cat);
  transactions.forEach(t => { if (t.userCat === cat) t.userCat = "Sonstiges"; });
  persistTxCats();
  persistTransactions();
  catmgrRefresh();
}

function catmgrAdd() {
  const inp = document.getElementById("catmgr-new-input");
  const val = inp?.value.trim();
  if (!val) return;
  if (!allTxCats().includes(val)) {
    txUserCats.push(val);
    persistTxCats();
  }
  inp.value = "";
  catmgrRefresh();
}
