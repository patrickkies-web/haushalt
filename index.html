// ── Payment helpers ────────────────────────────────────────────────────────
function getPayment(subId, yymm) {
  return (payments[subId] || {})[yymm] || null;
}

function txYYMM(t) {
  return t.date ? t.date.slice(0, 7) : null;
}

// which sub (if any) is this transaction linked to?
function txLinkedSub(txId) {
  for (const subId of Object.keys(payments)) {
    const sub = subs.find(s => s.id === subId);
    if (!sub) continue;
    for (const p of Object.values(payments[subId] || {})) {
      if (p.txId === txId) return sub;
    }
  }
  return null;
}

// fuzzy name similarity score (0–1) — shared characters / max length
function nameSim(a, b) {
  a = a.toLowerCase();
  b = b.toLowerCase();
  if (a.includes(b) || b.includes(a)) return 1;
  let hits = 0;
  b.split("").forEach(c => { if (a.includes(c)) hits++; });
  return hits / Math.max(a.length, b.length);
}

function txLinkToSub(txId) {
  const t = transactions.find(x => x.id === txId);
  if (!t) return;
  document.querySelectorAll(".tx-sub-picker").forEach(p => p.remove());
  document.querySelectorAll(".tx-sub-scrim").forEach(p => p.remove());

  const payee = t.payee || "";
  const sorted = [...subs].sort((a, b) => nameSim(b.name, payee) - nameSim(a.name, payee));

  const existingLink = txLinkedSub(txId);

  const rows = sorted.map(s => {
    const isLinked = existingLink && existingLink.id === s.id;
    const yymm = txYYMM(t);
    const alreadyPaid = yymm && getPayment(s.id, yymm);
    const note = isLinked ? "· verknüpft" : alreadyPaid ? "· bereits bezahlt" : "";
    return `<div class="tx-sub-row ${isLinked ? "active" : ""}" onclick="txConfirmLink('${txId}','${s.id}')">
      <div class="tx-sub-swatch" style="background:${catColor(s.cat)}">${esc(initials(s.name))}</div>
      <div class="tx-sub-info">
        <div class="tx-sub-name">${esc(s.name)}</div>
        <div class="tx-sub-meta">${esc(s.cat)} · ${eur.format(s.amount)} ${CYCLES[s.cycle].short} <span style="color:var(--accent)">${note}</span></div>
      </div>
    </div>`;
  }).join("");

  const popup = document.createElement("div");
  popup.className = "tx-sub-picker";
  popup.innerHTML = `<div style="width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px"></div>
    <div style="font-family:'Space Grotesk';font-weight:600;font-size:15px;margin-bottom:6px">Abo zuordnen</div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">Transaktion: <b>${esc(payee)}</b> · ${eur.format(t.amount)}</div>
    <div class="tx-sub-list">${rows || '<div style="color:var(--muted);font-size:13px;padding:8px 0">Noch keine Abos angelegt.</div>'}</div>
    ${existingLink ? `<button class="btn btn-ghost" style="margin-top:12px;width:100%" onclick="txUnlinkSub('${txId}')">Zuordnung entfernen</button>` : ""}`;

  const scrim = document.createElement("div");
  scrim.className = "tx-sub-scrim";
  scrim.onclick = () => { popup.remove(); scrim.remove(); };

  document.body.appendChild(scrim);
  document.body.appendChild(popup);
}

function txConfirmLink(txId, subId) {
  const t   = transactions.find(x => x.id === txId);
  const sub = subs.find(s => s.id === subId);
  if (!t || !sub) return;

  const txAmt  = Math.abs(t.amount);
  const subAmt = sub.amount;
  const diff   = Math.abs(txAmt - subAmt);

  if (diff < 0.01) {
    // amounts match — link directly
    doLinkTx(txId, subId, false);
  } else {
    // amounts differ — ask user
    showPriceChangeModal(txId, subId, subAmt, txAmt);
  }
}

function doLinkTx(txId, subId, isException) {
  const t = transactions.find(x => x.id === txId);
  if (!t) return;
  const yymm = txYYMM(t);
  if (!yymm) return;
  if (!payments[subId]) payments[subId] = {};
  payments[subId][yymm] = { txId, txAmount: t.amount, date: t.date, isException };
  persistPayments();
  document.querySelectorAll(".tx-sub-picker").forEach(p => p.remove());
  document.querySelectorAll(".tx-sub-scrim").forEach(p => p.remove());
  renderTransactions();
  // Re-render subscription list too
  render();
}

function txUnlinkSub(txId) {
  const t = transactions.find(x => x.id === txId);
  if (!t) return;
  const yymm = txYYMM(t);
  for (const subId of Object.keys(payments)) {
    const mp = payments[subId];
    if (mp && mp[yymm] && mp[yymm].txId === txId) {
      delete mp[yymm];
      if (!Object.keys(mp).length) delete payments[subId];
      break;
    }
  }
  persistPayments();
  document.querySelectorAll(".tx-sub-picker").forEach(p => p.remove());
  document.querySelectorAll(".tx-sub-scrim").forEach(p => p.remove());
  renderTransactions();
  render();
}

function showPriceChangeModal(txId, subId, subAmt, txAmt) {
  document.querySelectorAll(".tx-sub-picker").forEach(p => p.remove());
  document.querySelectorAll(".tx-sub-scrim").forEach(p => p.remove());
  document.querySelectorAll(".price-modal").forEach(p => p.remove());
  document.querySelectorAll(".price-modal-scrim").forEach(p => p.remove());

  const sub = subs.find(s => s.id === subId);
  const higher = txAmt > subAmt;

  const modal = document.createElement("div");
  modal.className = "price-modal";
  modal.innerHTML = `<div class="price-modal-icon">${higher ? "⬆" : "⬇"}</div>
    <div class="price-modal-title">Betrag weicht ab</div>
    <div class="price-modal-body">
      Gespeichert: <b class="num">${eur.format(subAmt)}</b><br>
      Tatsächlich abgebucht: <b class="num">${eur.format(txAmt)}</b>
    </div>
    <div class="price-modal-q">War das eine einmalige Ausnahme oder gilt der neue Betrag dauerhaft?</div>
    <div class="price-modal-btns">
      <button class="btn btn-ghost" onclick="txPriceException('${txId}','${subId}')">Einmalige Ausnahme</button>
      <button class="btn btn-primary" onclick="txPricePermanent('${txId}','${subId}',${txAmt})">Dauerhaft übernehmen</button>
    </div>`;

  const scrim = document.createElement("div");
  scrim.className = "price-modal-scrim";

  document.body.appendChild(scrim);
  document.body.appendChild(modal);
}

function txPriceException(txId, subId) {
  document.querySelectorAll(".price-modal").forEach(p => p.remove());
  document.querySelectorAll(".price-modal-scrim").forEach(p => p.remove());
  doLinkTx(txId, subId, true);
}

async function txPricePermanent(txId, subId, newAmt) {
  document.querySelectorAll(".price-modal").forEach(p => p.remove());
  document.querySelectorAll(".price-modal-scrim").forEach(p => p.remove());
  const i = subs.findIndex(s => s.id === subId);
  if (i > -1) {
    const sub = subs[i];
    const t   = transactions.find(x => x.id === txId);
    const yymm = t ? txYYMM(t) : null;
    if (!sub.priceHistory) sub.priceHistory = [];
    sub.priceHistory.push({ from: yymm || "?", amount: newAmt });
    sub.amount = Math.round(newAmt * 100) / 100;
    await persist();
    showToast(`Betrag von ${sub.name} auf ${eur.format(newAmt)} aktualisiert`);
  }
  doLinkTx(txId, subId, false);
}

// ── Helpers ────────────────────────────────────────────────────────────────
function monthlyOf(s) { return s.amount * CYCLES[s.cycle].perYear / 12; }
function yearlyOf(s)  { return s.amount * CYCLES[s.cycle].perYear; }

function subDeactMk(s) {
  if (!s.deactivatedFrom) return Infinity;
  const d = new Date(s.deactivatedFrom + "T00:00:00");
  return d.getFullYear() * 12 + d.getMonth();
}

function subIsInactive(s) { return !!s.deactivatedFrom; }

function toggleInactive() {
  showInactive = !showInactive;
  render();
}

function quickDeactivate() {
  const s = editing ? subs.find(x => x.id === editing) : null;
  if (!s) return;
  if (s.deactivatedFrom) {
    // Reaktivieren
    $("f-deact-date").value = "";
    $("deact-hint").textContent = "";
    $("deact-btn").textContent = "Deaktivieren";
  } else {
    // Deaktivieren: set to today (first of current month for clean boundary)
    const today = new Date();
    const iso   = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-01`;
    $("f-deact-date").value = iso;
    $("deact-hint").textContent = `(ab ${today.toLocaleDateString("de-DE", { month: "long", year: "numeric" })})`;
    $("deact-btn").textContent = "Reaktivieren";
  }
}

function clearDeact() {
  $("f-deact-date").value = "";
  $("deact-hint").textContent = "";
  $("deact-btn").textContent = "Deaktivieren";
}

function getInc(mk, field) {
  const m = income[String(mk)];
  return (m && m[field]) ? Number(m[field]) : 0;
}

function setInc(mk, field, val) {
  const k = String(mk);
  if (!income[k]) income[k] = {};
  income[k][field] = val;
}

function updateIncomeCol(mk) {
  const M = household.members;
  const exp = lastTotals[mk - lastStartIdx] || 0;
  const put = (id, text) => {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  };

  if (hhMode() === 'equal') {
    const per = M.length ? exp / M.length : 0;
    put(`cc-exp-${mk}`, exp ? eur.format(exp) : '–');
    M.forEach(m => put(`cc-pay_${m.id}-${mk}`, exp ? eur.format(per) : '–'));
    return;
  }

  if (hhMode() === 'income') {
    const wages = M.map(m => getInc(mk, m.id));
    const sum   = wages.reduce((a, v) => a + v, 0);
    // The rate that covers the costs exactly: p = Ausgaben / Gesamteinkommen
    const p = sum > 0 ? exp / sum : 0;
    put(`cc-inctot-${mk}`, sum ? eur.format(sum) : '–');
    put(`cc-exp-${mk}`,    exp ? eur.format(exp) : '–');
    put(`cc-pct-${mk}`,    sum ? (p * 100).toFixed(1).replace('.', ',') + ' %' : '–');
    M.forEach((m, i) => put(`cc-pay_${m.id}-${mk}`,
      sum ? eur.format(exp * wages[i] / sum) : '–'));
    return;
  }

  const wages = M.map(m => getInc(mk, m.id));
  const prevs = M.map(m => getInc(mk, 'prev_' + m.id));
  const o     = getInc(mk, 'other');
  const sock  = getInc(mk, 'sockel');

  const tot    = wages.reduce((a, v) => a + v, 0) + o;
  const surp   = tot - (lastTotals[mk - lastStartIdx] || 0);
  const share  = M.length ? surp / M.length : 0;
  const remain = surp - sock * M.length - prevs.reduce((a, v) => a + v, 0);
  const hasData = wages.some(v => v) || o || sock || prevs.some(v => v);

  const set = (id, v) => {
    const el = document.getElementById(id);
    if (el) el.textContent = hasData ? eur.format(v) : '–';
  };

  set(`cc-total-${mk}`,  tot);
  set(`cc-surp-${mk}`,   surp);
  set(`cc-share-${mk}`,  share);
  set(`cc-remain-${mk}`, remain);
  M.forEach((m, i) => set(`cc-pay_${m.id}-${mk}`, sock + prevs[i]));
}

function catColor(cat) {
  const i = CATS.indexOf(cat);
  return PALETTE[(i < 0 ? CATS.length - 1 : i) % PALETTE.length];
}

function initials(name) {
  return (name.trim()[0] || "?").toUpperCase();
}

function nextOccurrence(s) {
  if (!s.date) return null;
  let d = new Date(s.date + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const step = { monthly: 1, quarterly: 3, yearly: 12 }[s.cycle];
  let guard = 0;
  while (d < today && guard < 400) {
    d.setMonth(d.getMonth() + step);
    guard++;
  }
  return d;
}

function daysUntil(d) {
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  return Math.round((d - t) / 86400000);
}

function relDays(n) {
  if (n === 0) return "heute";
  if (n === 1) return "morgen";
  return "in " + n + " Tagen";
}

function parseAmount(v) {
  const n = parseFloat(String(v).replace(/\s/g, "").replace(/\./g, "").replace(",", "."));
  return isNaN(n) ? NaN : n;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function animateAmount(el, target) {
  if (!el) return;
  if (window.matchMedia("(prefers-reduced-motion:reduce)").matches) {
    el.textContent = eur.format(target);
    return;
  }
  const dur = 600, t0 = performance.now();
  function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = eur.format(target * e);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  if (needsSetup() || wizDraft) {
    $("toolbar").style.display = "none";
    $("fab").style.display = "none";
    $("summary").style.display = "none";
    $("data-row").style.display = "none";
    $("forecast").innerHTML = "";
    if (!wizDraft) wizStart(); else renderWizard();
    return;
  }
  const hasData = subs.length > 0;
  $("summary").style.display = "";
  $("data-row").style.display = "flex";
  $("toolbar").style.display = hasData ? "flex" : "none";
  $("fab").style.display = "flex";

  const totalMonthly = subs.reduce((a, s) => a + monthlyOf(s), 0);
  const totalYearly  = totalMonthly * 12;

  let html = "";
  html += `<div class="sum-label">Summe pro Monat</div>`;
  html += `<div class="sum-figure"><span class="amt" id="bigamt">${eur.format(0)}</span></div>`;
  html += `<div class="sum-meta">
    <span>≈ <b class="num">${eur0.format(totalYearly)}</b> im Jahr</span>
    <span><b class="num">${subs.length}</b> ${subs.length === 1 ? "Abo" : "Abos"}</span>
  </div>`;

  if (hasData) {
    // Composition bar
    const byCat = {};
    subs.forEach(s => { byCat[s.cat] = (byCat[s.cat] || 0) + monthlyOf(s); });
    const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

    html += `<div class="bar" id="bar">`;
    entries.forEach(([cat, v]) => {
      html += `<span data-w="${(v / totalMonthly * 100).toFixed(2)}" style="width:0;background:${catColor(cat)}"></span>`;
    });
    html += `</div><div class="legend">`;
    entries.forEach(([cat, v]) => {
      html += `<div><i style="background:${catColor(cat)}"></i>${cat} <b class="num">${eur0.format(v)}</b></div>`;
    });
    html += `</div>`;

    // Next payment
    const upcoming = subs
      .map(s => ({ s, d: nextOccurrence(s) }))
      .filter(x => x.d)
      .sort((a, b) => a.d - b.d)[0];

    if (upcoming) {
      const n = daysUntil(upcoming.d);
      html += `<div class="next">
        <span class="pill">Nächste Zahlung</span>
        <span><b>${esc(upcoming.s.name)}</b> · ${relDays(n)} · <span class="num">${eur.format(upcoming.s.amount)}</span></span>
      </div>`;
    }
  } else {
    html += `<div class="next" style="margin-top:16px;border:none;padding-top:14px">
      <span>Noch nichts erfasst — füge unten dein erstes Abo hinzu.</span>
    </div>`;
  }

  $("summary").innerHTML = html;
  animateAmount($("bigamt"), totalMonthly);
  requestAnimationFrame(() => {
    const bar = $("bar");
    if (bar) bar.querySelectorAll("span").forEach(sp => sp.style.width = sp.dataset.w + "%");
  });

  renderForecast();
  renderTransactions();

  // Subscription list
  $("count").textContent = subs.length + (subs.length === 1 ? " Eintrag" : " Einträge");
  const sortBy = $("sort").value;
  const sorted = [...subs].sort((a, b) => {
    if (sortBy === "name") return a.name.localeCompare(b.name, "de");
    if (sortBy === "next") {
      const da = nextOccurrence(a), db = nextOccurrence(b);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da - db;
    }
    return monthlyOf(b) - monthlyOf(a);
  });

  if (!hasData) {
    $("list").innerHTML = `<div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="#0f6e54" stroke-width="1.5"/>
        <path d="M12 8v4l2.5 2.5" stroke="#0f6e54" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h2>Behalte den Überblick</h2>
      <p>Erfasse deine Abos und Fixkosten — Turnus rechnet alles auf einen Monats- und Jahreswert um.</p>
      <button class="btn btn-primary" onclick="openSheet()">Erstes Abo hinzufügen</button>
    </div>`;
    return;
  }

  const renderSubRow = (s, inactive = false) => {
    const norm = s.cycle === "monthly" ? "" : ` · ≈ ${eur.format(monthlyOf(s))}/Mon.`;
    let deactTag = "";
    if (inactive && s.deactivatedFrom) {
      const d = new Date(s.deactivatedFrom + "T00:00:00");
      deactTag = `<div class="sub-deact-tag">Inaktiv seit ${d.toLocaleDateString("de-DE", { month: "short", year: "numeric" })}</div>`;
    }
    return `<div class="row${inactive ? " inactive-sub" : ""}" onclick="openSheet('${s.id}')">
      <div class="swatch" style="background:${catColor(s.cat)}">${esc(initials(s.name))}</div>
      <div class="row-main">
        <div class="row-name">${esc(s.name)}</div>
        <div class="row-sub">${esc(s.cat)}${norm}</div>
        ${deactTag}
      </div>
      <div class="row-amt">
        <div class="v">${eur.format(s.amount)}</div>
        <div class="c">${CYCLES[s.cycle].label}</div>
      </div>
    </div>`;
  };

  const activeSubs   = sorted.filter(s => !subIsInactive(s));
  const inactiveSubs = sorted.filter(s => subIsInactive(s));

  let listHtml = activeSubs.map(s => renderSubRow(s)).join("");

  if (inactiveSubs.length > 0) {
    listHtml += `<button class="inactive-toggle" onclick="toggleInactive()">
      <span>Inaktive Abos (${inactiveSubs.length})</span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="transition:transform .2s;transform:rotate(${showInactive ? 180 : 0}deg)">
        <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>`;
    if (showInactive) {
      listHtml += inactiveSubs.map(s => renderSubRow(s, true)).join("");
    }
  }

  $("list").innerHTML = listHtml;
}

function renderForecast() {
  const host = $("forecast");
  if (subs.length === 0) { host.innerHTML = ""; return; }

  const PAST     = 6;             // months to show in the past
  const FUTURE   = 35;            // months to show in the future
  const N        = PAST + 1 + FUTURE;
  const now      = new Date();
  now.setDate(1);
  now.setHours(0, 0, 0, 0);
  const curMk    = now.getFullYear() * 12 + now.getMonth();
  const startIdx = curMk - PAST;  // absolute month index of column 0
  const stepOf   = { monthly: 1, quarterly: 3, yearly: 12 };
  const mf       = new Intl.DateTimeFormat("de-DE", { month: "short" });

  const colDate = k => new Date(now.getFullYear(), now.getMonth() - PAST + k, 1);
  const colYYMM = k => { const d = colDate(k); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
  const isPast  = k => k < PAST;
  const isCur   = k => k === PAST;

  // Month headers
  let head = `<th class="name">Ausgabe</th>`;
  for (let k = 0; k < N; k++) {
    const d     = colDate(k);
    const cls   = [isCur(k) ? "cur" : "", isPast(k) ? "past-col" : ""].filter(Boolean).join(" ");
    head += `<th class="${cls}">${mf.format(d).replace(".", "")}<span class="yr">'${String(d.getFullYear()).slice(2)}</span></th>`;
  }

  const baseIndex = s => {
    const d = s.date ? new Date(s.date + "T00:00:00") : new Date(now);
    return d.getFullYear() * 12 + d.getMonth();
  };

  const rows   = [...subs].sort((a, b) => monthlyOf(b) - monthlyOf(a));
  const totals = new Array(N).fill(0);
  let body     = "";

  rows.forEach(s => {
    const step    = stepOf[s.cycle];
    const bi      = baseIndex(s);
    const deactMk = subDeactMk(s);
    let cells     = "";
    for (let k = 0; k < N; k++) {
      const i     = startIdx + k;
      const phase = (((i - bi) % step) + step) % step === 0;
      const withinActive = i < deactMk;
      const due   = phase && (bi <= curMk || i >= bi) && withinActive;
      const yymm  = colYYMM(k);
      const past  = isPast(k);
      const cur   = isCur(k);
      const baseCls = [cur ? "cur" : "", past ? "past-col" : ""].filter(Boolean).join(" ");
      // Mark the deactivation boundary cell
      const isDeactBoundary = (i === deactMk);

      if (due) {
        totals[k] += s.amount;
        const pay = (past || cur) ? getPayment(s.id, yymm) : null;
        if (pay) {
          const diffAmt = Math.abs(Math.abs(pay.txAmount) - s.amount) > 0.01;
          const fcCls   = diffAmt ? "fc-paid fc-diff" : "fc-paid fc-ok";
          cells += `<td class="${baseCls} ${fcCls}" onclick="fcCellClick('${s.id}','${yymm}')" title="${diffAmt ? 'Abweichung: geplant '+eur.format(s.amount) : 'Bezahlt'}">${eur.format(Math.abs(pay.txAmount))}</td>`;
        } else if (past || cur) {
          cells += `<td class="${baseCls} fc-unconfirmed" onclick="fcCellClick('${s.id}','${yymm}')" title="Noch nicht verknüpft">${eur.format(s.amount)}</td>`;
        } else {
          cells += `<td class="${baseCls}">${eur.format(s.amount)}</td>`;
        }
      } else if (isDeactBoundary) {
        cells += `<td class="empty ${baseCls} fc-deact-boundary" title="Deaktiviert ab diesem Monat">⊘</td>`;
      } else {
        cells += `<td class="empty ${baseCls}">–</td>`;
      }
    }
    const inactive = subIsInactive(s);
    const nameTag  = inactive
      ? `<span class="fc-inactive-badge">⊘</span>`
      : "";
    body += `<tr class="${inactive ? "fc-inactive-row" : ""}">
      <td class="name"><div class="namecell"><i style="background:${catColor(s.cat)}"></i><span>${esc(s.name)}${nameTag}</span></div></td>
      ${cells}
    </tr>`;
  });

  // Totals row
  let tot = `<td class="name"><span class="lbl">Summe / Monat</span></td>`;
  totals.forEach((v, k) => {
    const cls = [isCur(k) ? "cur" : "", isPast(k) ? "past-col" : ""].filter(Boolean).join(" ");
    tot += `<td class="${cls}">${v ? eur.format(v) : "–"}</td>`;
  });

  // Rotierkonto: only irregular (quarterly + yearly) subs need smoothing
  const irrTotals = new Array(N).fill(0);
  rows.forEach(s => {
    if (s.cycle === 'monthly') return;
    const step    = stepOf[s.cycle];
    const bi      = baseIndex(s);
    const deactMk = subDeactMk(s);
    for (let k = 0; k < N; k++) {
      const i = startIdx + k;
      const phase = (((i - bi) % step) + step) % step === 0;
      if (phase && (bi <= curMk || i >= bi) && i < deactMk) irrTotals[k] += s.amount;
    }
  });

  // Rhythm start: first month a transfer happens. Default = next month, so the
  // cushion gets funded at the end of the current one.
  const rotStartMk = (() => {
    const m = /^(\d{4})-(\d{2})$/.exec(rotCfg.start || "");
    return m ? (+m[1]) * 12 + (+m[2]) - 1 : curMk + 1;
  })();
  const rotStartCol = rotStartMk - startIdx;
  const setupPhase  = rotStartCol > PAST;   // rhythm has not begun yet

  // Window is always forward-looking: 24 months from the rhythm start, but
  // never reaching back before the current month once the rhythm is running.
  const WIN     = 24;
  const winFrom = Math.min(Math.max(rotStartCol, PAST), N - 1);
  const winEnd  = Math.min(winFrom + WIN, N);
  const winLen  = Math.max(1, winEnd - winFrom);
  const sumWin  = arr => arr.slice(winFrom, winEnd).reduce((a, v) => a + v, 0);
  const avgAll  = sumWin(totals)    / winLen;  // all subs — what a month really costs
  const avgIrr  = sumWin(irrTotals) / winLen;  // irregular only — the Rotierkonto rate

  // The deepest trough over the window decides the cushion
  let b = 0, minB = 0;
  for (let k = winFrom; k < winEnd; k++) {
    b += avgIrr - irrTotals[k];
    if (b < minB) minB = b;
  }
  const cushion = minB < -0.005 ? -minB : 0;

  // Ideal balance track, seeded with the cushion at the start of the rhythm
  const targetAt = new Array(N).fill(null);
  let t = cushion;
  for (let k = winFrom; k < N; k++) { t += avgIrr - irrTotals[k]; targetAt[k] = t; }

  // One transfer per month: bring the account from where it is to where it
  // should be. Without a known balance that is just the plain netto.
  const ist        = typeof rotCfg.balance === 'number' ? rotCfg.balance : null;
  const targetNow  = setupPhase ? cushion : (targetAt[PAST] ?? cushion);
  const plainNet   = setupPhase ? cushion : avgIrr - irrTotals[PAST];
  const action     = ist === null ? plainNet : targetNow - ist;

  const hasIrr = avgIrr > 0.005;

  // Average row, right under Summe / Monat
  let avgRow = `<td class="name"><span class="lbl">Ø / Monat · ${winLen} Mon.</span></td>`;
  for (let k = 0; k < N; k++) {
    const cls = [isCur(k) ? "cur" : "", isPast(k) ? "past-col" : ""].filter(Boolean).join(" ");
    avgRow += `<td class="${cls}">${avgAll > 0.005 ? eur.format(avgAll) : '–'}</td>`;
  }

  let rotSep = `<td class="name"><span class="lbl">Rotierkonto</span></td>`;
  let rotEin = `<td class="name"><span class="lbl">↑ Einzahlen / Monat</span></td>`;
  let rotAus = `<td class="name"><span class="lbl">↓ Auszahlen wenn fällig</span></td>`;
  let rotNet = `<td class="name"><span class="lbl">= Netto · Überweisung</span></td>`;
  let rotRes = `<td class="name"><span class="lbl">Rotierkonto Saldo</span></td>`;
  for (let k = 0; k < N; k++) {
    const cls = [isCur(k) ? "cur" : "", isPast(k) ? "past-col" : ""].filter(Boolean).join(" ");
    const due = irrTotals[k];
    rotSep += `<td class="${cls}"></td>`;
    if (!hasIrr || k < winFrom) {
      rotEin += `<td class="${cls}">–</td>`;
      rotAus += `<td class="${cls}">–</td>`;
      rotNet += `<td class="${cls}">–</td>`;
      rotRes += `<td class="${cls}">–</td>`;
      continue;
    }
    const net = avgIrr - due;
    rotEin += `<td class="${cls}">${eur.format(avgIrr)}</td>`;
    rotAus += `<td class="${cls}">${due > 0.005 ? eur.format(due) : '–'}</td>`;

// ── Day log ────────────────────────────────────────────────────────────────
const dayKey  = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayKey = () => dayKey(new Date());
const shiftDay = (key, n) => {
  const [y, m, d] = key.split('-').map(Number);
  return dayKey(new Date(y, m - 1, d + n));
};
const dayLabel = (key, opts) => {
  const [y, m, d] = key.split('-').map(Number);
  return new Intl.DateTimeFormat("de-DE", opts || { weekday: "short", day: "numeric", month: "long" })
    .format(new Date(y, m - 1, d));
};
const getDay = key => daylog[key] || {};

// One entry covers a waking day plus the night that follows it, so any date
// shown for a night names both of its days — "Fr., 18. → Sa., 19. Sept."
const nightLabel = key =>
  `${dayLabel(key, { weekday: 'short', day: 'numeric' })} → ${dayLabel(shiftDay(key, 1), { weekday: 'short', day: 'numeric', month: 'short' })}`;
const morningLabel = key =>
  dayLabel(shiftDay(key, 1), { weekday: 'long', day: 'numeric', month: 'short' });

// Times are stored as plain HH:MM. Going to bed at 23:40 and settling at
// 01:20 crosses midnight, so a negative span wraps into the next day.
const minsOf = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
const fmtSpan = m => {
  if (m === null) return '';
  m = Math.round(m);                     // medians of even-sized groups land on halves
  const neg = m < 0, a = Math.abs(m);
  const s = a < 60 ? `${a} min` : `${Math.floor(a / 60)} h ${String(a % 60).padStart(2, '0')} min`;
  return neg ? `−${s}` : s;
};

// Span from bedtime to resting heart rate. With an explicit date the
// difference is exact; without one a time before bedtime is read as the
// following morning.
function restSpan(key, e) {
  if (!e.sleepAt || !e.restingHr) return null;
  const bed = new Date(`${key}T${e.sleepAt}:00`);
  const hr  = new Date(`${e.restingHrDate || key}T${e.restingHr}:00`);
  let d = Math.round((hr - bed) / 60000);
  if (!e.restingHrDate && d < 0) d += 1440;
  return d;
}

function writeDay(key, field, value) {
  const e = daylog[key] || (daylog[key] = {});
  if (value === null || value === "" || value === undefined) delete e[field];
  else e[field] = value;
  if (Object.keys(e).length === 0) delete daylog[key];
}

async function setDay(key, field, value) {
  writeDay(key, field, value);
  await persistDaylog();
  renderSleep();
}

// Time and date inputs must not trigger a full re-render: replacing the input
// mid-interaction closes the native picker. Only the derived parts refresh.
async function setDayTime(key, field, value) {
  writeDay(key, field, value);
  // Entering the resting time without a date: infer which morning it was
  if (field === 'restingHr' && value) {
    const e = getDay(key);
    if (!e.restingHrDate) {
      writeDay(key, 'restingHrDate',
        (e.sleepAt && value < e.sleepAt) ? shiftDay(key, 1) : key);
    }
  }
  await persistDaylog();
  refreshDerived();
}

// Refresh only what depends on the values, never the inputs themselves.
function refreshDerived() {
  const key = curKey(), e = getDay(key);
  const span = restSpan(key, e);
  const box = $("nresult");
  if (box) {
    box.classList.toggle('pending', span === null);
    box.innerHTML = nresultInner(span, e);
  }
  const hist = $("sleep-hist-slot");
  if (hist) hist.innerHTML = sleepHistHtml(key);
}

// Tri-state: clicking the active button clears the field again
function dayToggle(key, field, value) {
  setDay(key, field, getDay(key)[field] === value ? null : value);
}

function dayCups(key, field, delta) {
  const cur = getDay(key)[field] || 0;
  const next = Math.max(0, Math.min(30, cur + delta));
  setDay(key, field, next === 0 ? null : next);
}

// ── Demo data ──────────────────────────────────────────────────────────────
// Thirty plausible nights so the analysis can be judged before real logging
// starts. Every entry carries demo:true and can be removed again in one go.
function demoEntries() {
  let seed = 20260918;                       // fixed, so the demo never changes
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const noise = () => { let s = 0; for (let i = 0; i < 6; i++) s += rnd(); return (s - 3) / 0.707; };
  const pad = n => String(n).padStart(2, '0');
  const hhmm = m => { m = ((m % 1440) + 1440) % 1440; return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
  const out = {};

  let nightRun = 0;
  for (let back = 30; back >= 1; back--) {
    const key = shiftDay(todayKey(), -back);
    const [Y, M, D] = key.split('-').map(Number);
    const dow = new Date(Y, M - 1, D).getDay();          // 0 So … 6 Sa
    const weekend = dow === 5 || dow === 6;

    // Night shifts come in short runs, as they usually do in a rota
    let shift;
    if (nightRun > 0) { shift = 'nacht'; nightRun--; }
    else if (rnd() < 0.09) { shift = 'nacht'; nightRun = 1 + Math.floor(rnd() * 2); }
    else shift = rnd() < 0.22 ? 'spaet' : 'frueh';

    // After a night shift you go to bed in the morning
    const bed = shift === 'nacht' ? 7 * 60 + Math.floor(rnd() * 90)
      : shift === 'spaet' ? 23 * 60 + 40 + Math.floor(rnd() * 70)
      : weekend ? 23 * 60 + 15 + Math.floor(rnd() * 90)
      : 22 * 60 + 20 + Math.floor(rnd() * 75);

    const e = { demo: true, sleepAt: hhmm(bed), shift };

    // Coffee almost every day, later on late and night shifts
    const noCoffee = rnd() < 0.12;
    let cofGapH = null;
    if (!noCoffee) {
      const cups = 1 + Math.floor(rnd() * (shift === 'frueh' ? 3 : 4));
      const last = shift === 'nacht' ? 2 * 60 + Math.floor(rnd() * 180)
        : shift === 'spaet' ? 15 * 60 + Math.floor(rnd() * 240)
        : 9 * 60 + Math.floor(rnd() * 480);
      e.coffee = true; e.coffeeCups = cups; e.coffeeLast = hhmm(last);
      e.coffeeType = ['filter', 'cappuccino', 'unterwegs'][Math.floor(rnd() * 3)];
      cofGapH = (((bed - last) % 1440) + 1440) % 1440 / 60;
    } else e.coffee = false;

    // Dinner, heavier and later at the weekend
    const foodAt = (weekend ? 19 * 60 + 30 : 18 * 60 + 30) + Math.floor(rnd() * 120);
    e.foodTime = hhmm(shift === 'nacht' ? 1 * 60 + Math.floor(rnd() * 120) : foodAt);
    e.foodType = rnd() < (weekend ? 0.45 : 0.25) ? 'fettig' : rnd() < 0.3 ? 'scharf' : 'leicht';

    // Alcohol mostly at the weekend
    let alcRest = 0;
    if (rnd() < (weekend ? 0.55 : 0.12)) {
      const units = 1 + Math.floor(rnd() * 3);
      const last = 20 * 60 + Math.floor(rnd() * 180);
      e.alcohol = true; e.alcUnits = units; e.alcLast = hhmm(last);
      alcRest = Math.max(0, units - ((((bed - last) % 1440) + 1440) % 1440) / 60);
    } else e.alcohol = false;

    // Sport two or three times a week, sauna now and then
    if (rnd() < 0.38) { e.sport = true; e.sportEnd = hhmm(17 * 60 + Math.floor(rnd() * 210)); }
    else e.sport = false;
    let saunaGapH = null;
    if (rnd() < 0.13) {
      const end = 18 * 60 + Math.floor(rnd() * 210);
      e.sauna = true; e.saunaEnd = hhmm(end);
      saunaGapH = ((((bed - end) % 1440) + 1440) % 1440) / 60;
    } else e.sauna = false;

    e.brainwork = rnd() < (shift === 'frueh' ? 0.3 : 0.5);
    e.relaxed   = rnd() < 0.55;
    if (rnd() < 0.3) { e.mast = true; e.mastTime = hhmm(bed - 10 - Math.floor(rnd() * 70)); }
    else e.mast = false;

    // The settling span: a few real effects, plus day-to-day noise that keeps
    // most of them short of proof at thirty nights — which is the honest picture.
    let span = 58 + noise() * 15;
    if (shift === 'nacht') span += 40;
    if (cofGapH !== null && cofGapH < 5) span += 26;
    span += alcRest * 20;
    if (saunaGapH !== null && saunaGapH < 2) span += 30;
    if (e.brainwork) span += 9;
    span = Math.max(18, Math.round(span));

    // The night rolls over only when the clock time falls back past bedtime,
    // which is not the same as the raw minute count passing 1440
    const bedClock = ((bed % 1440) + 1440) % 1440;
    const hrClock  = (((bed + span) % 1440) + 1440) % 1440;
    e.restingHr = hhmm(hrClock);
    e.restingHrDate = hrClock < bedClock ? shiftDay(key, 1) : key;

    // The rating follows the body loosely — people misjudge their own nights
    if (rnd() > 0.1) {
      const noisy = span + noise() * 22;
      e.quality = noisy < 68 ? 'gut' : noisy < 100 ? 'mittel' : 'schlecht';
    }
    out[key] = e;
  }
  return out;
}

  showToast('Beispieltage entfernt');
}

// ── The night screen ───────────────────────────────────────────────────────
// One screen shows exactly one night and nothing else. Every field is always
// present, whether filled or not, so the layout never moves while in use.
// Each section names the weekday it happens on, because the entry spans two.
let sleepDay = null;          // null = the night the clock is currently in

// The logbook night rolls over at 05:00: a tap at 00:30 still belongs to the
// evening it is, not to the morning that just started.
function logDayKey() {
  const d = new Date();
  if (d.getHours() < 5) d.setDate(d.getDate() - 1);
  return dayKey(d);
}
const curKey = () => sleepDay || logDayKey();
const nowHHMM = () => {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};

function sleepGo(n)  { sleepDay = shiftDay(curKey(), n); renderSleep(); }
function sleepNow()  { sleepDay = null; renderSleep(); }
function sleepOpen(k){ sleepDay = k; renderSleep(); }

// Stamp the clock into a field, optionally setting a kind and bumping a count
async function stamp(key, field, opts = {}) {
  const e = getDay(key), t = nowHHMM();
  writeDay(key, field, t);
  if (opts.flag) writeDay(key, opts.flag, true);
  if (opts.count) writeDay(key, opts.count, (e[opts.count] || 0) + 1);
  if (opts.kind && opts.kindVal) writeDay(key, opts.kind, opts.kindVal);
  await persistDaylog();
  renderSleep();
  showToast(`${opts.label || field} · ${t}`);
}

async function wipe(key, fields) {
  fields.forEach(f => writeDay(key, f, null));
  await persistDaylog();
  renderSleep();
}

function nresultInner(span, e) {
  if (span !== null) return `<span class="nresult-v">${esc(fmtSpan(span))}</span>
    <span class="nresult-l">vom Augen-zumachen bis zum Ruhepuls</span>`;
  const miss = !e.sleepAt && !e.restingHr ? 'Augen zu und Ruhepuls fehlen'
    : !e.sleepAt ? 'Augen-zu-Zeit fehlt' : 'Ruhepuls fehlt';
  return `<span class="nresult-v">–:–</span>
    <span class="nresult-l">${esc(miss)}</span>`;
}

// ── Transactions ───────────────────────────────────────────────────────────
function parseTxAmount(str) {
  if (!str) return 0;
  const clean = str.replace(/\s/g, "").replace("€", "").replace(/\./g, "").replace(",", ".");
  return parseFloat(clean) || 0;
}

function parseTxDate(str) {
  if (!str) return "";
  const m = str.match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  if (!m) return "";
  return `${m[3]}-${m[2]}-${m[1]}`;
}

function txFingerprint(t) {
  return `${t.date}|${t.amount}|${t.payee}|${t.accountNumber}`.toLowerCase().trim();
}

function parseTransactionData(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = lines[0].split("\t").map(h => h.trim());
  const col = h => headers.indexOf(h);
  const result = [];
  lines.slice(1).forEach(line => {
    if (!line.trim()) return;
    const c = line.split("\t");
    const get = h => { const i = col(h); return i >= 0 ? (c[i] || "").trim() : ""; };
    const amount = parseTxAmount(get("Betrag"));
    const date   = parseTxDate(get("Buchungsdatum"));
    const t = {
      id: null,
      type: get("Transaktionstyp"),
      date,
      amount,
      payee: get("Zahlungsempfänger"),
      iban: get("IBAN"),
      purpose: (get("Verwendungszweck") || get("Beschreibung")),
      accountNumber: get("Kontonummer"),
      accountName: get("Kontoname"),
      c24Cat: get("Kategorie") || "Sonstiges",
      userCat: null,
    };
    t.fp = txFingerprint(t);
    result.push(t);
  });
  return result;
}

function importTxData(text) {
  const parsed = parseTransactionData(text);
  if (!parsed.length) { showToast("Keine Transaktionen erkannt"); return { added: 0, skipped: 0, months: [] }; }
  const existing = new Set(transactions.map(t => t.fp));
  let added = 0, skipped = 0;
  const newMonths = new Set();
  parsed.forEach(t => {
    if (existing.has(t.fp)) { skipped++; return; }
    t.id = "t" + Date.now() + Math.random().toString(36).slice(2, 5);
    transactions.push(t);
    existing.add(t.fp);
    if (t.date) newMonths.add(t.date.slice(0, 7));
    added++;
  });
  transactions.sort((a, b) => b.date.localeCompare(a.date));
  persistTransactions();
  return { added, skipped, months: [...newMonths].sort() };
}

function txEffectiveCat(t) {
  return t.userCat || t.c24Cat || "Sonstiges";
}

function txIsTransfer(t) {
  if (t.userCat && t.userCat !== "Umbuchung") return false;
  return t.type === "Pocket-Umbuchung" || t.c24Cat === "Umbuchung" || t.userCat === "Umbuchung";
}

  document.querySelectorAll(".tx-catmgr-popup,[data-scrim]").forEach(p => p.remove());
}

function catmgrRefresh() {
  const list = document.getElementById("catmgr-list");
  if (list) list.innerHTML = buildCatmgrList();
}

function catmgrRename(oldCat) {
  const newName = prompt(`Kategorie umbenennen:`, oldCat);
  if (!newName) return;
  const val = newName.trim();
  if (!val || val === oldCat) return;
  const ui = txUserCats.indexOf(oldCat);
  if (ui > -1) txUserCats[ui] = val;
  else txUserCats.push(val);
  transactions.forEach(t => { if (t.userCat === oldCat) t.userCat = val; });
  persistTxCats();
  persistTransactions();
  catmgrRefresh();
}

function catmgrDelete(cat) {
  if (!confirm(`Kategorie "${cat}" löschen? Betroffene Transaktionen werden auf "Sonstiges" gesetzt.`)) return;
  txUserCats = txUserCats.filter(c => c !== cat);
  transactions.forEach(t => { if (t.userCat === cat) t.userCat = "Sonstiges"; });
  persistTxCats();
  persistTransactions();
  catmgrRefresh();
}

function catmgrAdd() {
  const inp = document.getElementById("catmgr-new-input");
  const val = inp?.value.trim();
  if (!val) return;
  if (!allTxCats().includes(val)) {
    txUserCats.push(val);
    persistTxCats();
  }
  inp.value = "";
  catmgrRefresh();
}

// ── Settlement helpers ─────────────────────────────────────────────────────
function txGetSettlement(txId) {
  return settlements.find(s => s.expenseTxId === txId || (s.reimbursementTxIds||[]).includes(txId)) || null;
}

function settlementNetAmount(s) {
  const expTx = transactions.find(t => t.id === s.expenseTxId);
  const reimbs = (s.reimbursementTxIds||[]).map(id => transactions.find(t => t.id === id)).filter(Boolean);
  return (expTx ? expTx.amount : 0) + reimbs.reduce((a, t) => a + t.amount, 0);
}

function txOpenSettlementPicker(txId) {
  document.querySelectorAll(".tx-cat-popup,.tx-settle-popup,[data-scrim]").forEach(p => p.remove());
  const expTx = transactions.find(t => t.id === txId);
  if (!expTx || expTx.amount >= 0) return;
  window._settleIds = new Set();

  const allSettleTxIds = new Set(settlements.flatMap(s => [s.expenseTxId, ...(s.reimbursementTxIds||[])]));
  const candidates = transactions.filter(t => t.amount > 0 && !allSettleTxIds.has(t.id));

  const popup = document.createElement("div");
  popup.className = "tx-settle-popup";
  popup.style.cssText = "position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100vw);background:var(--surface);border-radius:20px 20px 0 0;padding:12px 16px 32px;box-shadow:0 -8px 40px rgba(20,30,25,.18);z-index:60;max-height:80vh;overflow-y:auto";

  const rebuildSettle = () => {
    const total = [...window._settleIds].map(id => transactions.find(t => t.id === id)).filter(Boolean).reduce((a, t) => a + t.amount, 0);
    const net = expTx.amount + total;
    popup.querySelector("#settle-net").textContent = `Nettobetrag: ${eur.format(net)}${net !== 0 ? ` (${eur.format(Math.abs(net))} ${net < 0 ? "offen" : "Guthaben"})` : ""}`;
    popup.querySelectorAll(".settle-pick-row").forEach(row => {
      const sel = window._settleIds.has(row.dataset.tid);
      row.classList.toggle("selected", sel);
      row.querySelector(".settle-check").textContent = sel ? "☑" : "☐";
    });
  };

  const cHtml = candidates.length
    ? candidates.map(t => `<div class="settle-pick-row" data-tid="${t.id}" onclick="settleTogglePick('${t.id}')">
        <span class="settle-check">☐</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.payee||"Unbekannt")}</div>
          <div style="font-size:11px;color:var(--muted)">${t.date||""}</div>
        </div>
        <div style="font-weight:700;color:var(--accent);white-space:nowrap">${eur.format(t.amount)}</div>
      </div>`).join("")
    : `<div style="color:var(--muted);font-size:13px;padding:12px 0">Keine verfügbaren Einnahmen.</div>`;

  popup.innerHTML = `<div style="width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px"></div>
    <div style="font-family:'Space Grotesk';font-weight:600;font-size:15px;margin-bottom:4px">Ausgleich verknüpfen</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Ausgabe: ${esc(expTx.payee||"Unbekannt")} · ${eur.format(expTx.amount)}</div>
    <div style="max-height:45vh;overflow-y:auto;margin-bottom:10px">${cHtml}</div>
    <div id="settle-net" style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:12px">Nettobetrag: ${eur.format(expTx.amount)}</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" style="flex:1" onclick="document.querySelectorAll('.tx-settle-popup,[data-scrim]').forEach(p=>p.remove());window._settleIds=null">Abbrechen</button>
      <button class="btn btn-primary" style="flex:1" onclick="confirmSettlement('${txId}')">Verknüpfen</button>
    </div>`;

  window._settleRebuild = rebuildSettle;

  const scrim = document.createElement("div");
  scrim.dataset.scrim = "1";
  scrim.style.cssText = "position:fixed;inset:0;background:rgba(18,24,21,.28);z-index:59;backdrop-filter:blur(2px)";
  scrim.onclick = () => { popup.remove(); scrim.remove(); window._settleIds = null; };
  document.body.appendChild(scrim);
  document.body.appendChild(popup);
}

function settleTogglePick(txId) {
  if (!window._settleIds) return;
  if (window._settleIds.has(txId)) window._settleIds.delete(txId);
  else window._settleIds.add(txId);
  if (window._settleRebuild) window._settleRebuild();
}

function confirmSettlement(expenseTxId) {
  const ids = [...(window._settleIds||new Set())];
  if (!ids.length) { showToast("Mindestens eine Erstattung auswählen"); return; }
  settlements.push({
    id: "sl" + Date.now() + Math.random().toString(36).slice(2, 4),
    expenseTxId,
    reimbursementTxIds: ids
  });
  persistSettlements();
  document.querySelectorAll(".tx-settle-popup,[data-scrim]").forEach(p => p.remove());
  window._settleIds = null;
  renderTransactions();
  showToast("Ausgleich verknüpft");
}

  const net = (expTx ? expTx.amount : 0) + reimbs.reduce((a, t) => a + t.amount, 0);
  const netPos = net >= 0;

  const popup = document.createElement("div");
  popup.className = "tx-settle-detail";
  popup.style.cssText = "position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100vw);background:var(--surface);border-radius:20px 20px 0 0;padding:12px 16px 32px;box-shadow:0 -8px 40px rgba(20,30,25,.18);z-index:60;max-height:80vh;overflow-y:auto";
  popup.innerHTML = `<div style="width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px"></div>
    <div style="font-family:'Space Grotesk';font-weight:600;font-size:15px;margin-bottom:14px">Ausgleich-Details</div>
    <div style="padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:10px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:3px">Ausgabe</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:14px;font-weight:600">${esc(expTx?.payee||"Unbekannt")}</div>
        <div style="font-weight:700;color:var(--danger)">${eur.format(expTx?.amount||0)}</div>
      </div>
      <div style="font-size:11px;color:var(--muted)">${expTx?.date||""}</div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Erstattungen (${reimbs.length})</div>
    ${reimbs.map(t => `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bg)">
      <div><div style="font-size:13px">${esc(t.payee||"Unbekannt")}</div><div style="font-size:11px;color:var(--muted)">${t.date||""}</div></div>
      <div style="font-weight:700;color:var(--accent)">${eur.format(t.amount)}</div>
    </div>`).join("")}
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;margin-top:8px;border-top:2px solid var(--line)">
      <div style="font-weight:700">Nettobetrag</div>
      <div style="font-weight:700;font-size:16px;color:${netPos?"var(--accent)":"var(--danger)"}">${eur.format(net)}</div>
    </div>
    ${net !== 0 ? `<div style="font-size:12px;color:var(--muted);text-align:center;margin-top:2px;margin-bottom:12px">Differenz: ${eur.format(Math.abs(net))} ${netPos?"Guthaben":"offen"}</div>` : `<div style="margin-bottom:12px"></div>`}
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" style="flex:1" onclick="document.querySelectorAll('.tx-settle-detail,[data-scrim]').forEach(p=>p.remove())">Schließen</button>
      <button class="btn btn-danger" style="flex:1" onclick="deleteSettlement('${settlementId}')">Aufheben</button>
    </div>`;

  const scrim = document.createElement("div");
  scrim.dataset.scrim = "1";
  scrim.style.cssText = "position:fixed;inset:0;background:rgba(18,24,21,.28);z-index:59;backdrop-filter:blur(2px)";
  scrim.onclick = () => { popup.remove(); scrim.remove(); };
  document.body.appendChild(scrim);
  document.body.appendChild(popup);
}

function deleteSettlement(settlementId) {
  if (!confirm("Verknüpfung aufheben?")) return;
  settlements = settlements.filter(s => s.id !== settlementId);
  persistSettlements();
  document.querySelectorAll(".tx-settle-detail,[data-scrim]").forEach(p => p.remove());
  renderTransactions();
  showToast("Verknüpfung aufgehoben");
}

// ── IOU helpers ────────────────────────────────────────────────────────────

  popup.innerHTML = `<div style="width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px"></div>
    <div style="font-family:'Space Grotesk';font-weight:600;font-size:15px;margin-bottom:14px">Für andere bezahlt</div>
    <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px">Person</label>
    <input id="iou-person" type="text" value="${esc(existing.person||"")}" placeholder="Name der Person" style="width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;color:var(--ink);margin-bottom:12px" autocomplete="off">

    <input id="iou-note" type="text" value="${esc(existing.note||"")}" placeholder="z. B. Kino-Tickets, Abendessen" style="width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;color:var(--ink);margin-bottom:12px" autocomplete="off">
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:16px;cursor:pointer">
      <input id="iou-settled" type="checkbox" ${existing.settled ? "checked" : ""} style="width:18px;height:18px;cursor:pointer">
      Bereits ausgeglichen
    </label>
    <div style="display:flex;gap:8px">
      ${existing.person !== undefined ? `<button class="btn btn-danger" style="flex:1" onclick="clearIOU('${txId}')">Entfernen</button>` : ""}
      <button class="btn btn-ghost" style="flex:1" onclick="document.querySelectorAll('.tx-iou-popup,[data-scrim]').forEach(p=>p.remove())">Abbrechen</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveIOU('${txId}')">Speichern</button>
    </div>`;
  const scrim = document.createElement("div");
  scrim.dataset.scrim = "1";
  scrim.style.cssText = "position:fixed;inset:0;background:rgba(18,24,21,.28);z-index:59;backdrop-filter:blur(2px)";
  scrim.onclick = () => { popup.remove(); scrim.remove(); };
  document.body.appendChild(scrim);
  document.body.appendChild(popup);
}

function saveIOU(txId) {
  const t = transactions.find(x => x.id === txId);
  if (!t) return;
  const person  = document.getElementById("iou-person")?.value.trim();
  const note    = document.getElementById("iou-note")?.value.trim();
  const settled = document.getElementById("iou-settled")?.checked || false;
  if (!person) { showToast("Bitte einen Namen eingeben"); return; }
  t.iou = { person, note, settled };
  persistTransactions();
  document.querySelectorAll(".tx-iou-popup,[data-scrim]").forEach(p => p.remove());
  renderTransactions();
}

function clearIOU(txId) {
  const t = transactions.find(x => x.id === txId);
  if (!t) return;
  delete t.iou;
  persistTransactions();
  document.querySelectorAll(".tx-iou-popup,[data-scrim]").forEach(p => p.remove());
  renderTransactions();
}

  popup.innerHTML = `<div style="width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px"></div>
    <div style="text-align:center;margin-bottom:16px">

function closeTxDetail() {
  document.querySelectorAll(".tx-detail-popup,[data-scrim]").forEach(p => p.remove());
}

function renderTransactions() {
  const host = $("transactions");
  const isA2 = txActiveAcc === "a2";
  const accNum = txAccCfg[txActiveAcc]?.number || "";

  // Current selected month
  const now = new Date();
  const d   = new Date(now.getFullYear(), now.getMonth() + txMonthOffset, 1);
  const monthStr = d.toLocaleString("de-DE", { month: "long", year: "numeric" });
  const yymm = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;

  // Filter transactions for this month and active account
  let monthTx = transactions.filter(t => t.date.startsWith(yymm));
  if (accNum) monthTx = monthTx.filter(t => t.accountNumber === accNum);
  // For a2 (Gemeinschaftskonto), keep all including transfers (Aufladungen are transfers)
  if (!isA2 && txHideTransfer) monthTx = monthTx.filter(t => !txIsTransfer(t));

  let visible = monthTx;
  if (txFilter === "income")  visible = monthTx.filter(t => t.amount > 0);
  if (txFilter === "expense") visible = monthTx.filter(t => t.amount < 0);

  // Settlement classification
  const settledExpIds   = new Set(settlements.map(s => s.expenseTxId));
  const settledReimbIds = new Set(settlements.flatMap(s => s.reimbursementTxIds||[]));
  const settleByTxId    = {};
  settlements.forEach(s => {
    settleByTxId[s.expenseTxId] = s;
    (s.reimbursementTxIds||[]).forEach(id => { settleByTxId[id] = s; });
  });

  // Effective income: exclude reimbursements
  const income = monthTx.filter(t => t.amount > 0 && !settledReimbIds.has(t.id))
                         .reduce((s, t) => s + t.amount, 0);

  // Effective expense: net for settled, full for others
  const processedSettle = new Set();
  let expense = 0;
  monthTx.filter(t => t.amount < 0).forEach(t => {
    if (settledExpIds.has(t.id)) {
      const s = settleByTxId[t.id];
      if (s && !processedSettle.has(s.id)) { expense += settlementNetAmount(s); processedSettle.add(s.id); }
    } else {
      expense += t.amount;
    }
  });
  const balance = income + expense;

  // Outstanding IOUs
  const outstandingIOUs    = monthTx.filter(t => t.iou && !t.iou.settled && t.amount < 0);
  const outstandingIouAmt  = outstandingIOUs.reduce((s, t) => s + Math.abs(t.amount), 0);

  // Category breakdown (expenses only, net for settled)
  const catTotals = {};
  const processedSettleCat = new Set();
  monthTx.filter(t => t.amount < 0).forEach(t => {
    const cat = txEffectiveCat(t);
    if (settledExpIds.has(t.id)) {
      const s = settleByTxId[t.id];
      if (s && !processedSettleCat.has(s.id)) {
        const net = settlementNetAmount(s);
        if (net < 0) catTotals[cat] = (catTotals[cat]||0) + Math.abs(net);
        processedSettleCat.add(s.id);
      }
    } else {
      catTotals[cat] = (catTotals[cat]||0) + Math.abs(t.amount);
    }
  });
  const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]).slice(0, 7);
  const maxCat = catEntries[0]?.[1] || 1;

  const catBarHtml = catEntries.length ? `<div class="tx-cat-bar-wrap">
    <div class="tx-cat-bar-title">Ausgaben nach Kategorie</div>
    ${catEntries.map(([cat, v]) => `<div class="tx-cat-row">
      <div class="tx-cat-name">${esc(cat)}</div>
      <div class="tx-cat-track"><div class="tx-cat-fill" style="width:${(v/maxCat*100).toFixed(1)}%"></div></div>
      <div class="tx-cat-amt">${eur.format(v)}</div>
    </div>`).join("")}
  </div>` : "";

  const iouBarHtml = outstandingIouAmt > 0 ? `<div class="iou-outstanding-bar">
    <span>⏳ Für andere ausstehend (${outstandingIOUs.length})</span>
    <span class="iou-outstanding-amt">${eur.format(outstandingIouAmt)}</span>
  </div>` : "";

  // Transaction list grouped by date
  const grouped = {};
  visible.forEach(t => {
    const dk = t.date || "unbekannt";
    if (!grouped[dk]) grouped[dk] = [];
    grouped[dk].push(t);
  });

  const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

  const formatDate = str => {
    if (!str || str === "unbekannt") return "Unbekanntes Datum";
    const [y, m, day] = str.split("-");
    const d = new Date(Number(y), Number(m) - 1, Number(day));
    return d.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "long" });
  };

  let listHtml = "";
  if (!sortedDates.length) {
    listHtml = `<div class="tx-empty">Keine Transaktionen für ${monthStr}.</div>`;
  } else {
    sortedDates.forEach(dk => {
      listHtml += `<div class="tx-day-sep">${formatDate(dk)}</div>`;
      grouped[dk].forEach(t => {
        const isPos  = t.amount > 0;
        const isNeu  = t.amount === 0;
        const cls    = isNeu ? "neu" : (isPos ? "pos" : "neg");
        const amtCls = isNeu ? "" : (isPos ? "pos" : "neg");
        const cat    = txEffectiveCat(t);
        const acct   = t.accountName ? ` · ${t.accountName}` : "";
        const linked    = txLinkedSub(t.id);
        const settle    = txGetSettlement(t.id);
        const isExpense = t.amount < 0;
        const isReimb   = settle && (settle.reimbursementTxIds||[]).includes(t.id);

        const linkBadge = linked
          ? `<span class="tx-linked-badge" onclick="txLinkToSub('${t.id}')">
               <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
               ${esc(linked.name)}
             </span>`
          : (isExpense && subs.length > 0
              ? `<span class="tx-link-btn" onclick="txLinkToSub('${t.id}')">Abo +</span>`
              : "");

        const settleBadge = settle
          ? `<span class="tx-settle-badge" onclick="txShowSettlementDetail('${settle.id}')">⇄ ${isReimb ? "Ausgleich" : `Netto: ${eur.format(settlementNetAmount(settle))}`}</span>`
          : (isExpense
              ? `<span class="tx-link-btn" style="border-color:rgba(128,96,192,.5);color:#7050b8;background:rgba(128,96,192,.08)" onclick="txOpenSettlementPicker('${t.id}')">Ausgleich +</span>`
              : "");

        const iouBadge = t.iou
          ? `<span class="tx-iou-badge ${t.iou.settled ? "settled" : "open"}" onclick="txMarkIOU('${t.id}')">${t.iou.settled ? "✓" : "⏳"} ${esc(t.iou.person)}</span>`
          : (isExpense
              ? `<span class="tx-iou-btn" onclick="txMarkIOU('${t.id}')">Für andere</span>`
              : "");

        const iouMeta = t.iou?.note ? ` · ${esc(t.iou.note)}` : "";

        listHtml += `<div class="tx-item" data-txid="${t.id}" onclick="if(!event.target.closest('[onclick]:not(.tx-item)'))txShowDetail('${t.id}')">
          <div class="tx-dot ${cls}"></div>
          <div class="tx-main">
            <div class="tx-payee">${esc(t.payee || "Unbekannt")}</div>
            <div class="tx-meta">${esc(t.type)}${acct}${iouMeta}</div>
            <div class="tx-chips-row">
              <span class="tx-cat-chip" onclick="txEditCat('${t.id}')">${esc(cat)}</span>
              ${linkBadge}
              ${settleBadge}
              ${iouBadge}
            </div>
          </div>
          <div class="tx-right">
            <div class="tx-amt ${amtCls}">${t.amount > 0 ? "+" : ""}${eur.format(t.amount)}</div>
          </div>
        </div>`;
      });
    });
  }

  const pasteArea = transactions.length === 0 ? `<div class="tx-paste-wrap" id="tx-paste-box">
    <div style="font-size:13px;color:var(--muted);margin-bottom:10px">C24-Transaktionen einfügen (aus der Rockets-App kopieren)</div>
    <textarea id="tx-paste-input" placeholder="Transaktionsdaten hier einfügen..."></textarea>
    <div class="tx-paste-actions">
      <button class="btn btn-primary" onclick="txDoImport()">Einlesen</button>
    </div>
  </div>` : "";

  const incomeLabel = isA2 ? "Aufladungen" : "Einnahmen";
  const accTabBar = `<div class="tx-acc-bar">
    <button class="tx-acc-tab ${txActiveAcc==="a1"?"active":""}" onclick="setTxAcc('a1')">${esc(txAccCfg.a1.label)}</button>
    <button class="tx-acc-tab ${txActiveAcc==="a2"?"active":""}" onclick="setTxAcc('a2')">${esc(txAccCfg.a2.label)}</button>
    <button class="tx-acc-cfg-btn" onclick="openAccConfig()" title="Konten konfigurieren">⚙</button>
  </div>`;
  const hideTransferRow = isA2 ? "" : `<div class="tx-hide-row">
    <label><input type="checkbox" ${txHideTransfer?"checked":""} onchange="txToggleTransfer(this.checked)"> Umbuchungen ausblenden</label>
  </div>`;

  host.innerHTML = `<div>
    <div class="tx-head">
      <div><h2>Transaktionen</h2><span class="hint">C24 Rockets · Ausgaben im Blick</span></div>
      <button class="tx-import-btn" onclick="txShowPaste()">+ Einfügen</button>
    </div>
    ${accTabBar}
    ${pasteArea}
    <div class="tx-month-nav">
      <button onclick="txNavMonth(-1)">‹</button>
      <span class="tx-month-label">${monthStr}</span>
      <button onclick="txNavMonth(1)" ${txMonthOffset >= 0 ? "disabled style='opacity:.4'" : ""}>›</button>
    </div>
    <div class="tx-summary-row">
      <div class="tx-sum-card pos">
        <span class="lbl">${incomeLabel}</span>
        <span class="val num">${eur.format(income)}</span>
      </div>
      <div class="tx-sum-card neg">
        <span class="lbl">Ausgaben</span>
        <span class="val num">${eur.format(Math.abs(expense))}</span>
      </div>
      <div class="tx-sum-card ${balance >= 0 ? "pos" : "neg"}">
        <span class="lbl">Saldo</span>
        <span class="val num">${eur.format(balance)}</span>
      </div>
    </div>
    ${catBarHtml}
    ${iouBarHtml}
    <div class="tx-filter-row">
      <button class="tx-filter-btn ${txFilter==="all"?"active":""}" onclick="txSetFilter('all')">Alle</button>
      <button class="tx-filter-btn ${txFilter==="income"?"active":""}" onclick="txSetFilter('income')">${incomeLabel}</button>
      <button class="tx-filter-btn ${txFilter==="expense"?"active":""}" onclick="txSetFilter('expense')">Ausgaben</button>
    </div>
    ${hideTransferRow}
    ${listHtml}
  </div>`;
}

function txGoToLinked(txId) {
  // switch to transactions tab and scroll to the linked transaction
  document.querySelectorAll(".tab-btn").forEach(b => {
    if (b.dataset.tab === "tx") b.click();
  });
  setTimeout(() => {
    const el = document.querySelector(`[data-txid="${txId}"]`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }, 100);
}

function txNavMonth(dir) {
  txMonthOffset = Math.min(0, txMonthOffset + dir);
  renderTransactions();
}

function txSetFilter(f) {
  txFilter = f;
  renderTransactions();
}

function txToggleTransfer(val) {
  txHideTransfer = val;
  renderTransactions();
}

function txShowPaste() {
  const host = $("transactions");
  const existing = host.querySelector(".tx-paste-wrap");
  if (existing) { existing.querySelector("textarea").focus(); return; }
  const div = document.createElement("div");
  div.className = "tx-paste-wrap";
  div.id = "tx-paste-box";
  div.innerHTML = `<div style="font-size:13px;color:var(--muted);margin-bottom:10px">C24-Transaktionen einfügen (aus der Rockets-App kopieren)</div>
    <textarea id="tx-paste-input" placeholder="Transaktionsdaten hier einfügen..."></textarea>
    <div class="tx-paste-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('tx-paste-box').remove()">Abbrechen</button>
      <button class="btn btn-primary" onclick="txDoImport()">Einlesen</button>
    </div>`;
  host.querySelector(".tx-head").after(div);
  div.querySelector("textarea").focus();
}

function txDoImport() {
  const inp = document.getElementById("tx-paste-input");
  if (!inp || !inp.value.trim()) return;
  const { added, skipped, months } = importTxData(inp.value);
  const mf = new Intl.DateTimeFormat("de-DE", { month: "short", year: "2-digit" });
  const monthLabels = months.map(ym => {
    const [y, m] = ym.split("-").map(Number);
    return mf.format(new Date(y, m - 1, 1));
  }).join(", ");
  if (added > 0) {
    const dupNote  = skipped > 0 ? ` · ${skipped} bereits vorhanden` : "";
    const monNote  = monthLabels ? ` · ${monthLabels}` : "";
    showToast(`${added} neu eingelesen${dupNote}${monNote}`);
    // Navigate to the earliest new month
    if (months.length > 0) {
      const [y, m] = months[0].split("-").map(Number);
      const now2   = new Date();
      const diff   = (y - now2.getFullYear()) * 12 + (m - 1 - now2.getMonth());
      txMonthOffset = Math.min(0, diff);
    }
  } else {
    showToast(skipped > 0 ? `Alle ${skipped} bereits vorhanden – nichts Neues` : "Keine Transaktionen erkannt");
  }
  renderTransactions();
}

function txEditCat(id) {
  const t = transactions.find(x => x.id === id);
  if (!t) return;

  // Remove existing popup
  document.querySelectorAll(".tx-cat-popup").forEach(p => p.remove());

  const currentCat = txEffectiveCat(t);
  const allCats = [...new Set([...allTxCats(), t.c24Cat])].filter(Boolean);

  const popup = document.createElement("div");
  popup.className = "tx-cat-popup";
  popup.style.cssText = "position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100vw);background:var(--surface);border-radius:20px 20px 0 0;padding:12px 16px 32px;box-shadow:0 -8px 40px rgba(20,30,25,.18);z-index:60;max-height:65vh;overflow-y:auto";

  const chips = allCats.map(cat => `<button style="font-family:inherit;font-size:13px;font-weight:${cat===currentCat?700:500};color:${cat===currentCat?"var(--accent)":"var(--muted)"};background:${cat===currentCat?"var(--accent-tint)":"var(--bg)"};border:1.5px solid ${cat===currentCat?"var(--accent)":"transparent"};border-radius:20px;padding:8px 13px;cursor:pointer;margin:3px" onclick="txSetCat('${id}','${esc(cat)}')">${esc(cat)}</button>`).join("");

  popup.innerHTML = `<div style="width:38px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <span style="font-family:'Space Grotesk';font-weight:600;font-size:15px">Kategorie wählen</span>
      <button class="btn btn-ghost" style="font-size:12px;padding:5px 10px" onclick="openTxCatManager()">Bearbeiten</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px">${chips}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Eigene Kategorie:</div>
    <div style="display:flex;gap:8px">
      <input id="tx-cat-custom" type="text" value="" placeholder="z. B. Kinder, Arzt, Hobby" style="flex:1;font-family:inherit;font-size:14px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;color:var(--ink)" autocomplete="off">
      <button class="btn btn-primary" onclick="txSetCatCustom('${id}')" style="padding:10px 16px;border-radius:12px">OK</button>
    </div>`;

  const scrim = document.createElement("div");
  scrim.dataset.scrim = "1";
  scrim.style.cssText = "position:fixed;inset:0;background:rgba(18,24,21,.28);z-index:59;backdrop-filter:blur(2px)";
  scrim.onclick = () => { popup.remove(); scrim.remove(); };

  document.body.appendChild(scrim);
  document.body.appendChild(popup);
}

function txSetCat(id, cat) {
  const t = transactions.find(x => x.id === id);
  if (!t) return;
  t.userCat = cat;
  persistTransactions();
  document.querySelectorAll(".tx-cat-popup,[data-scrim]").forEach(p => p.remove());
  renderTransactions();
}

function txSetCatCustom(id) {
  const inp = document.getElementById("tx-cat-custom");
  const val = inp?.value.trim();
  if (!val) return;
  txSetCat(id, val);
}

// ── Sheet ──────────────────────────────────────────────────────────────────
function openSheet(id) {
  editing = id || null;
  const s = id ? subs.find(x => x.id === id) : null;
  $("sheet-title").textContent = s ? "Abo bearbeiten" : "Neues Abo";
  $("f-name").value   = s ? s.name : "";
  $("f-amount").value = s ? String(s.amount).replace(".", ",") : "";
  $("f-date").value   = s ? s.date || "" : "";
  $("f-note").value   = s ? s.note || "" : "";
  draft.cycle = s ? s.cycle : "monthly";
  draft.cat   = s ? s.cat   : "Sonstiges";
  $("f-cycle").querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.c === draft.cycle));
  addingCat = false;
  buildCats();
  $("delete-btn").style.display = s ? "block" : "none";
  // Deactivation section — only when editing
  const deactWrap = $("f-deact-wrap");
  const deactBtn  = $("deact-btn");
  if (s) {
    deactWrap.style.display = "";
    $("f-deact-date").value = s.deactivatedFrom || "";
    const hint = $("deact-hint");
    if (s.deactivatedFrom) {
      const d = new Date(s.deactivatedFrom + "T00:00:00");
      hint.textContent = `(seit ${d.toLocaleDateString("de-DE", { month: "long", year: "numeric" })})`;
      deactBtn.textContent = "Reaktivieren";
      deactBtn.style.display = "block";
    } else {
      hint.textContent = "";
      deactBtn.textContent = "Deaktivieren";
      deactBtn.style.display = "block";
    }
  } else {
    deactWrap.style.display = "none";
    deactBtn.style.display = "none";
  }
  clearErr();
  $("scrim").classList.add("on");
  $("sheet").classList.add("on");
}

function closeSheet() {
  $("scrim").classList.remove("on");
  $("sheet").classList.remove("on");
}

function buildCats() {
  const host = $("f-cat");
  let html = CATS.map(c => `<button data-cat="${esc(c)}" class="${c === draft.cat ? "active" : ""}">${esc(c)}</button>`).join("");
  html += `<button class="newcat" id="cat-new">+ Neu</button>`;
  host.innerHTML = html;
  host.querySelectorAll("button[data-cat]").forEach(b => b.onclick = () => {
    draft.cat = b.dataset.cat;
    addingCat = false;
    buildCats();
  });
  $("cat-new").onclick = () => { addingCat = true; renderCatInput(); };
  if (addingCat) renderCatInput();
}

function renderCatInput() {
  const host = $("f-cat");
  const old  = document.getElementById("cat-input-row");
  if (old) old.remove();

  const row       = document.createElement("div");
  row.id          = "cat-input-row";
  row.className   = "cat-input-row";
  row.innerHTML   = `<input id="cat-input" type="text" placeholder="Neue Kategorie" autocomplete="off" maxlength="24">
    <button id="cat-confirm" class="btn btn-primary">Hinzufügen</button>`;
  host.appendChild(row);

  const inp = document.getElementById("cat-input");
  inp.focus();

  const confirm = () => {
    const v = inp.value.trim();
    if (!v) return;
    let match = CATS.find(c => c.toLowerCase() === v.toLowerCase());
    if (!match) { CATS.push(v); match = v; persistCats(); }
    draft.cat = match;
    addingCat = false;
    buildCats();
  };

  document.getElementById("cat-confirm").onclick = confirm;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); confirm(); } });
}

function clearErr() {
  $("err-name").classList.remove("on");
  $("err-amount").classList.remove("on");
}

// ── CRUD ───────────────────────────────────────────────────────────────────
async function save() {
  clearErr();
  const name   = $("f-name").value.trim();
  const amount = parseAmount($("f-amount").value);
  let ok = true;
  if (!name)                       { $("err-name").classList.add("on");   ok = false; }
  if (isNaN(amount) || amount < 0) { $("err-amount").classList.add("on"); ok = false; }
  if (!ok) return;

  const deactEl = $("f-deact-date");
  const data = {
    name,
    amount: Math.round(amount * 100) / 100,
    cycle:  draft.cycle,
    cat:    draft.cat,
    date:   $("f-date").value || null,
    note:   $("f-note").value.trim(),
    deactivatedFrom: (deactEl && deactEl.value) ? deactEl.value : null,
  };

  if (editing) {
    const i = subs.findIndex(x => x.id === editing);
    if (i > -1) subs[i] = { ...subs[i], ...data };
  } else {
    subs.push({ id: "s" + Date.now() + Math.random().toString(36).slice(2, 6), ...data });
  }

  await persist();
  closeSheet();
  render();
}

async function del() {
  if (!editing) return;
  subs = subs.filter(x => x.id !== editing);
  await persist();
  closeSheet();
  render();
}

// ── Import / Export ────────────────────────────────────────────────────────
function exportData() {
  const date    = new Date().toISOString().slice(0, 10);
  const payload = JSON.stringify({
    v: 2,
    subs, cats: CATS, income,
    transactions, payments, txcats: txUserCats, settlements,
    accounts: txAccCfg, rotierkonto: rotCfg, daylog, household,
    exported: new Date().toISOString()
  }, null, 2);
  const blob    = new Blob([payload], { type: "application/json" });
  const url     = URL.createObjectURL(blob);
  const a       = document.createElement("a");
  a.href        = url;
  a.download    = `haushalt-${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`Gespeichert: haushalt-${date}.json`);
}

async function importData(file) {
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!Array.isArray(data.subs)) throw new Error("Kein gültiges Haushalt-Backup");
    if ((subs.length > 0 || transactions.length > 0) &&
        !confirm(`Vorhandene Daten ersetzen? (${subs.length} Abos, ${transactions.length} Umsätze)`)) return;

    subs   = data.subs;
    CATS   = (Array.isArray(data.cats) && data.cats.length) ? data.cats : [...DEFAULT_CATS];
    income = (data.income && typeof data.income === 'object') ? data.income : {};

    // Everything below only exists in v2 backups — older files just skip it
    if (Array.isArray(data.transactions)) transactions = data.transactions;
    if (data.payments && typeof data.payments === 'object') payments = data.payments;
    if (Array.isArray(data.txcats))       txUserCats  = data.txcats;
    if (Array.isArray(data.settlements))  settlements = data.settlements;
    if (data.accounts && typeof data.accounts === 'object') {
      if (data.accounts.a1) txAccCfg.a1 = { ...txAccCfg.a1, ...data.accounts.a1 };
      if (data.accounts.a2) txAccCfg.a2 = { ...txAccCfg.a2, ...data.accounts.a2 };
    }
    if (data.rotierkonto && typeof data.rotierkonto === 'object') {
      const r = data.rotierkonto;
      if (typeof r.start === 'string') rotCfg.start = r.start;
      if (typeof r.balance === 'number' || r.balance === null) rotCfg.balance = r.balance;
    }
    if (data.daylog && typeof data.daylog === 'object') daylog = data.daylog;
    if (data.household && Array.isArray(data.household.members) && data.household.members.length)
      household = data.household;

    await Promise.all([
      persist(), persistCats(), persistIncome(), persistTransactions(),
      persistPayments(), persistTxCats(), persistSettlements(),
      persistAccCfg(), persistRotCfg()
    ]);
    render();
    showToast(`${subs.length} Abos, ${transactions.length} Umsätze geladen`);
  } catch (e) {
    showToast("Fehler: " + e.message);
  }
}

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 3000);
}

// ── Event listeners ────────────────────────────────────────────────────────
$("f-cycle").querySelectorAll("button").forEach(b => b.onclick = () => {
  draft.cycle = b.dataset.c;
  $("f-cycle").querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
});
$("fab").onclick        = () => openSheet();
$("save-btn").onclick   = save;
$("cancel-btn").onclick = closeSheet;
$("delete-btn").onclick = del;
$("scrim").onclick      = closeSheet;
$("sort").onchange      = render;
$("export-btn").onclick = exportData;
$("import-btn").onclick = () => $("import-file").click();
$("import-file").onchange = e => { importData(e.target.files[0]); e.target.value = ""; };
$("hh-btn").onclick = () => openHousehold();
$("sync-btn").onclick = () => ghReady() ? ghPull() : openSyncConfig();
$("sync-btn").oncontextmenu = e => { e.preventDefault(); openSyncConfig(); };
// Pick up changes made on another device when the tab comes back into focus
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && ghReady()) ghPull({ silent: true });
});

document.querySelectorAll(".tab-btn").forEach(btn => btn.onclick = () => {
  const tab = btn.dataset.tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
  $("pane-turnus").style.display = tab === "turnus" ? "" : "none";
  $("pane-tx").style.display     = tab === "tx"     ? "" : "none";
  $("pane-sleep").style.display  = tab === "sleep"  ? "" : "none";
  $("pane-stats").style.display  = tab === "stats"  ? "" : "none";
  $("fab").style.display         = tab === "turnus" ? "flex" : "none";
  if (tab === "tx")    renderTransactions();
  if (tab === "sleep") renderSleep();
  if (tab === "stats") renderStats();
});

// Register the worker so the app opens without a connection once installed
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

load();
</script>
